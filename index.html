<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V11</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: sans-serif; color: #00fbff; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        
        /* Angka di pojok kiri atas - Dibuat ringan tanpa bayangan berat */
        #num { 
            position: absolute; top: 10px; left: 10px; 
            font-size: 80px; font-weight: bold; z-index: 99; 
        }

        /* Nama TV di bawah - Muncul sebentar saja */
        #info { 
            position: absolute; bottom: 50px; left: 50px; 
            padding: 10px 20px; border-left: 10px solid #00fbff;
            background: rgba(0,0,0,0.7); display: none; z-index: 99;
        }
    </style>
</head>
<body onclick="v.play()">

    <div id="num"></div>
    <div id="info">
        <h2 id="n"></h2>
        <p>DIGITAL TV</p>
    </div>
    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const num = document.getElementById('num');
        const info = document.getElementById('info');
        const n = document.getElementById('n');
        
        let ch = [];
        let cur = 0;
        let b = "";
        let h = new Hls();

        // AMBIL DATA LANGSUNG (Tanpa Proxy agar tidak lemot)
        fetch("https://iptv-org.github.io/iptv/languages/ind.m3u")
            .then(r => r.text())
            .then(d => {
                const lines = d.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        ch.push({ 
                            name: lines[i].split(',')[1].trim(), 
                            url: lines[i+1].trim() 
                        });
                    }
                }
                play(0);
            });

        function play(i) {
            if (i < 0) i = ch.length - 1;
            if (i >= ch.length) i = 0;
            cur = i;

            // Tampilkan Info
            n.innerText = (i + 1) + ". " + ch[i].name;
            info.style.display = 'block';
            setTimeout(() => { info.style.display = 'none'; }, 3000);

            // Engine Paling Ringan
            if (h) h.destroy();
            h = new Hls({
                capLevelToPlayerSize: true,
                maxBufferLength: 5, // Buffer kecil supaya cepat nyala
                enableWorker: false // Matikan worker supaya RAM TV tidak penuh
            });
            
            h.loadSource(ch[i].url);
            h.attachMedia(v);
            h.on(Hls.Events.MANIFEST_PARSED, () => v.play());
        }

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            // Navigasi PR/CH
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") play(cur - 1);

            // Input Angka
            if (/[0-9]/.test(e.key)) {
                b += e.key;
                num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    let target = parseInt(b) - 1;
                    if (ch[target]) play(target);
                    b = ""; num.innerText = "";
                }, 700); // Respon sangat cepat
            }
        });
    </script>
</body>
</html>
