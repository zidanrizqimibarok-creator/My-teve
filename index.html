<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V11 - AAA3 V54 DEEP SCAN</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        /* ASLI V11 */
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: sans-serif; color: #00fbff; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        #num { position: absolute; top: 10px; left: 10px; font-size: 80px; font-weight: bold; z-index: 99; }
        
        /* KOTAK INFO DENGAN TRANSISI HALUS */
        #info { 
            position: absolute; bottom: 50px; left: 50px; 
            padding: 15px 25px; border-left: 8px solid #00fbff;
            background: rgba(0,10,20,0.8); z-index: 99;
            opacity: 0; transition: opacity 1.5s ease; pointer-events: none;
        }

        #alert-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; background: rgba(255, 0, 0, 0.9); color: white;
            border: 4px solid white; border-radius: 15px; font-size: 2.5rem; font-weight: bold;
            display: none; z-index: 100; text-align: center;
        }

        /* SCAN UI PROGRES % */
        #scan-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; padding: 30px; background: #000; border: 2px solid #00fbff;
            display: none; z-index: 1000; text-align: center;
        }
        #scan-perc { font-size: 3rem; font-weight: bold; margin: 10px 0; color: #00fbff; }

        /* SHORTCUT 7091 */
        #shortcut {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 80%; background: rgba(0,0,0,0.95); border: 1px solid #00fbff;
            display: none; z-index: 500; padding: 20px; overflow-y: auto;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px;
        }
        .sc-item { padding: 12px; border: 1px solid #222; color: #444; }
        .sc-item.focus { background: #00fbff; color: #000; font-weight: bold; }

        #boot { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body onclick="document.documentElement.requestFullscreen(); v.play();">

    <div id="boot"><h1 style="letter-spacing:10px;">AAA3 SYSTEM</h1></div>
    <div id="num"></div>
    <div id="alert-center">⚠️ SINYAL TERACAK</div>
    
    <div id="scan-ui">
        <h2 style="color:#00fbff; letter-spacing: 5px;">DEEP SCANNING</h2>
        <div id="scan-perc">0%</div>
        <div style="margin: 10px 0;">
            <span style="color:red;">OFF: <span id="sc-bad">0</span></span> | 
            <span style="color:#00fbff;">ON: <span id="sc-good">0</span></span>
        </div>
        <p id="sc-name" style="font-size:10px; color:#555; text-transform: uppercase;">Initializing...</p>
    </div>

    <div id="shortcut"></div>

    <div id="info">
        <h2 id="n"></h2>
        <p>DIGITAL TV - AAA3</p>
        <div style="width: 220px; height: 5px; background: #222; margin-top:10px;">
            <div id="bar-fill" style="width:0%; height:100%; background:#00fbff;"></div>
        </div>
        <p id="btxt" style="font-size: 12px; margin-top: 5px; font-weight: bold; color: yellow;">MENUNGGU SINYAL: 10s</p>
    </div>

    <video id="v" playsinline autoplay></video>
    <video id="test-v" style="display:none;" muted></video>

    <script>
        const v = document.getElementById('v');
        const tv = document.getElementById('test-v');
        const h = new Hls(); const th = new Hls();
        const scBox = document.getElementById('shortcut');
        const alertBox = document.getElementById('alert-center');
        const btxt = document.getElementById('btxt');
        const bar = document.getElementById('bar-fill');
        const info = document.getElementById('info');
        
        let ch = []; let fullCh = []; let cur = 0; let scIdx = 0; let b = "";
        let isSc = false; let mode = "AVS1"; let timerCD; let count = 10;

        setTimeout(() => { document.getElementById('boot').style.display = 'none'; }, 5000);

        function load() {
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); let temp = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        temp.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                    }
                }
                fullCh = [...temp]; ch = [...temp];
                play(0);
            });
        }

        async function deepScan() {
            document.getElementById('scan-ui').style.display = 'block';
            let bad = 0; let good = 0; let checked = [];
            for(let i=0; i < ch.length; i++) {
                let perc = Math.round((i / ch.length) * 100);
                document.getElementById('scan-perc').innerText = perc + "%";
                document.getElementById('sc-name').innerText = "Checking: " + ch[i].name;

                let isAlive = await new Promise((res) => {
                    th.loadSource(ch[i].url); th.attachMedia(tv);
                    let t = setTimeout(() => { th.stopLoad(); res(false); }, 4000); // Scan lebih ketat
                    th.once(Hls.Events.FRAG_BUFFERED, () => { clearTimeout(t); res(true); });
                    th.once(Hls.Events.ERROR, () => { clearTimeout(t); res(false); });
                });

                if(isAlive) { good++; checked.push(ch[i]); } else { bad++; }
                document.getElementById('sc-bad').innerText = bad;
                document.getElementById('sc-good').innerText = good;
            }
            document.getElementById('scan-perc').innerText = "100%";
            setTimeout(() => {
                ch = checked; document.getElementById('scan-ui').style.display = 'none'; play(0);
            }, 1000);
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i; isSc = false; scBox.style.display = 'none'; alertBox.style.display = 'none';
            document.getElementById('n').innerText = (i + 1) + ". " + ch[i].name;
            
            info.style.opacity = "1"; // Tampil tegas
            
            clearInterval(timerCD);
            count = 10;
            btxt.style.color = "yellow";
            btxt.innerText = "MENUNGGU SINYAL: " + count + "s";
            bar.style.width = "0%";

            h.loadSource(ch[i].url); h.attachMedia(v);

            timerCD = setInterval(() => {
                count--;
                if(count >= 0) {
                    btxt.innerText = "MENUNGGU SINYAL: " + count + "s";
                } else {
                    clearInterval(timerCD);
                    alertBox.style.display = 'block';
                    btxt.innerText = "SINYAL TERPUTUS";
                    btxt.style.color = "red";
                }
            }, 1000);

            v.onplaying = () => {
                clearInterval(timerCD);
                btxt.innerText = "SIGNAL: 100%";
                btxt.style.color = "#00fbff";
                bar.style.width = "100%";
                setTimeout(() => { info.style.opacity = "0"; }, 4000); // Hilang perlahan
            };
        }

        function openShortcut() {
            isSc = true; scBox.innerHTML = ""; scBox.style.display = 'grid';
            ch.forEach((item, i) => {
                let d = document.createElement('div');
                d.className = "sc-item" + (i === scIdx ? " focus" : "");
                d.innerHTML = `[${i+1}] ${item.name}`;
                scBox.appendChild(d);
            });
            scBox.children[scIdx].scrollIntoView({ block: "center" });
        }

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (isSc) {
                if (c == 33 || c == 427 || e.key == "ArrowUp") { scIdx = (scIdx > 0) ? scIdx - 1 : ch.length - 1; openShortcut(); }
                if (c == 34 || c == 428 || e.key == "ArrowDown") { scIdx = (scIdx < ch.length - 1) ? scIdx + 1 : 0; openShortcut(); }
                if (e.key == "0") play(scIdx); 
                return;
            }
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") {
                if (b === "82") { // KODE 82 + PR-
                    ch = [...fullCh]; play(0); b = ""; document.getElementById('num').innerText = "";
                } else {
                    play(cur - 1);
                }
            }
            if (/[0-9]/.test(e.key)) {
                b += e.key; document.getElementById('num').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "7091") { scIdx = cur; openShortcut(); }
                    else if (b === "1062") deepScan();
                    else if (b === "0000") { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
                    else if (b !== "82") { // Biar kode 82 nunggu tombol PR-
                        let t = parseInt(b)-1; if(ch[t]) play(t);
                    }
                    if (b !== "82") { b = ""; document.getElementById('num').innerText = ""; }
                }, 800);
            }
        });
        load();
    </script>
</body>
</html>
