<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V28 - Anti Blank</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        video { position: absolute; width: 100vw; height: 100vh; object-fit: fill; z-index: 1; }
        #canvas-monitor { position: absolute; width: 1px; height: 1px; opacity: 0; } /* Detektor Pixel Hitam */
        #osd { position: absolute; bottom: 5%; left: 5%; width: 90%; background: rgba(0,0,0,0.9); padding: 20px; border-left: 10px solid #00fbff; z-index: 10; display: none; }
        #num-display { position: absolute; top: 5%; right: 5%; font-size: 8rem; color: #00fbff; font-weight: bold; z-index: 100; display: none; }
        #error-msg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #00001a; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 30; }
    </style>
</head>
<body onclick="tv.play()">
    <video id="tv" playsinline autoplay></video>
    <canvas id="canvas-monitor"></canvas>
    <div id="num-display"></div>

    <div id="osd">
        <h2 id="ch-title">MENGHUBUNGKAN...</h2>
        <div style="width:100%; height:8px; background:#222; margin-top:10px;"><div id="bar-fill" style="width:0%; height:100%; background:#00fbff;"></div></div>
        <p id="status-txt" style="color:#00fbff; font-size:0.9rem; margin-top:5px;">REAL TIME CHECKING...</p>
    </div>

    <div id="error-msg">
        <h1 style="color:red; font-size:3rem;">⚠️ SINYAL TERPUTUS</h1>
        <p>Link sedang down atau diblokir. Coba channel lain.</p>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBoS3INezO0UQptcXYNZFbnPbmmf_hU8xc", databaseURL: "https://xbook-global26-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tv = document.getElementById('tv');
        const osd = document.getElementById('osd');
        const canvas = document.getElementById('canvas-monitor');
        const ctx = canvas.getContext('2d');
        
        let hls = new Hls(); let blankCheckTimer;

        // Deteksi Layar Blank Hitam (Real-Time)
        function checkBlackScreen() {
            if (tv.paused || tv.ended) return;
            ctx.drawImage(tv, 0, 0, 1, 1);
            const pixel = ctx.getImageData(0, 0, 1, 1).data;
            // Jika RGB mendekati 0,0,0 berarti blank hitam
            if (pixel[0] < 5 && pixel[1] < 5 && pixel[2] < 5) {
                return true;
            }
            return false;
        }

        function play(idx) {
            db.ref("current_playlist").once("value", (snap) => {
                const list = snap.val(); if (!list || !list[idx]) return;
                const ch = list[idx];
                
                document.getElementById('error-msg').style.display = 'none';
                osd.style.display = 'block';
                document.getElementById('ch-title').innerText = ch.name;

                if (hls) hls.destroy(); hls = new Hls({
                    manifestLoadingTimeOut: 10000,
                    levelLoadingTimeOut: 10000
                });

                hls.loadSource(ch.url);
                hls.attachMedia(tv);

                // Jika dalam 10 detik tetap blank, munculkan error
                clearTimeout(blankCheckTimer);
                blankCheckTimer = setTimeout(() => {
                    if (checkBlackScreen()) {
                        osd.style.display = 'none';
                        document.getElementById('error-msg').style.display = 'flex';
                        db.ref("live_signal").set(0);
                    }
                }, 10000);

                tv.onplaying = () => {
                    db.ref("live_signal").set(100);
                    setTimeout(() => { osd.style.display = 'none'; }, 2000);
                };
                
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        osd.style.display = 'none';
                        document.getElementById('error-msg').style.display = 'flex';
                    }
                });
            });
        }

        db.ref("current_channel").on("value", (s) => { if (s.val() !== null) play(s.val()); });
        db.ref("typing_now").on("value", (s) => {
            if(s.val()) {
                const d = document.getElementById('num-display');
                d.innerText = s.val(); d.style.display = 'block';
                setTimeout(() => d.style.display = 'none', 3000);
            }
        });
    </script>
</body>
</html>
