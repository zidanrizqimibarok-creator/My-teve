<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AAA3 SET A BOX - V41</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { width: 100vw; height: 100vh; object-fit: contain; z-index: 1; }
        
        /* Peringatan Sinyal Teracak - DI TENGAH */
        #alert-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 60px; background: rgba(255, 0, 0, 0.9); color: white;
            border: 5px solid white; border-radius: 20px; font-size: 2.5rem; font-weight: bold;
            z-index: 200; display: none; text-align: center; box-shadow: 0 0 100px red;
        }

        /* Kotak Info Channel - DI BAWAH */
        #info-box { 
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); 
            width: 80%; max-width: 600px; padding: 25px; background: rgba(0, 5, 15, 0.95);
            border-bottom: 6px solid #00fbff; border-radius: 15px; display: none; z-index: 90;
        }
        #ch-name { color: #fff; font-size: 2rem; font-weight: 900; margin-bottom: 10px; }
        .progress-bg { width: 100%; height: 8px; background: #111; border-radius: 4px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #00fbff; transition: 0.4s; }
        #stat-txt { color: #00fbff; font-size: 1rem; margin-top: 10px; font-weight: bold; }

        /* Menu Daftar Channel (Tekan OK) */
        #menu-sidebar {
            position: absolute; left: 0; top: 0; width: 350px; height: 100%;
            background: rgba(0, 0, 0, 0.95); border-right: 3px solid #00fbff;
            display: none; flex-direction: column; z-index: 300;
        }
        .m-head { padding: 25px; background: #00fbff; color: #000; font-weight: bold; font-size: 1.5rem; text-align: center; }
        .m-list { overflow-y: auto; flex: 1; }
        .m-item { padding: 20px; border-bottom: 1px solid #222; cursor: pointer; color: #ccc; font-size: 1.2rem; }
        .m-item:hover, .m-item.active { background: #00fbff; color: #000; }

        #num-overlay { position: absolute; top: 30px; right: 50px; font-size: 100px; font-weight: 900; color: #00fbff; z-index: 100; }
    </style>
</head>
<body onclick="v.play()">

    <div id="num-overlay"></div>
    
    <div id="alert-center">⚠️ SINYAL TERACAK</div>
    
    <div id="info-box">
        <div id="ch-name">MENCARI SINYAL...</div>
        <div class="progress-bg"><div id="progress-fill"></div></div>
        <p id="stat-txt">CONNECTING...</p>
    </div>
    
    <div id="menu-sidebar">
        <div class="m-head">DAFTAR SALURAN</div>
        <div class="m-list" id="mlist"></div>
    </div>

    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const alertBox = document.getElementById('alert-center');
        const info = document.getElementById('info-box');
        const fill = document.getElementById('progress-fill');
        const stat = document.getElementById('stat-txt');
        const mlist = document.getElementById('mlist');
        const sidebar = document.getElementById('menu-sidebar');
        const numOver = document.getElementById('num-overlay');
        
        let ch = []; let cur = 0; let b = ""; let h = null; let mode = "AVS1";

        function load(url) {
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); ch = []; mlist.innerHTML = "";
                let count = 0;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        let name = lines[i].split(',')[1].trim();
                        let url = lines[i+1].trim();
                        ch.push({ name, url });
                        let item = document.createElement('div');
                        item.className = "m-item";
                        item.innerHTML = `<b>${count+1}</b> &nbsp; ${name}`;
                        let idx = count;
                        item.onclick = () => { play(idx); sidebar.style.display = 'none'; };
                        mlist.appendChild(item);
                        count++;
                    }
                }
                if (ch.length > 0) play(0);
            });
        }

        function play(i) {
            if (i < 0) i = ch.length - 1;
            if (i >= ch.length) i = 0;
            cur = i;
            
            alertBox.style.display = 'none';
            document.getElementById('ch-name').innerText = (i + 1) + ". " + ch[i].name;
            info.style.display = 'block';
            stat.innerText = "MENGHUBUNGKAN...";
            fill.style.width = "5%";

            if (h) h.destroy();
            h = new Hls({ maxBufferLength: 10, enableWorker: false });
            h.loadSource(ch[i].url);
            h.attachMedia(v);
            
            h.on(Hls.Events.ERROR, (e, data) => { if(data.fatal) alertBox.style.display = 'block'; });

            v.onprogress = () => {
                if (v.buffered.length > 0) {
                    let p = Math.round((v.buffered.end(0) - v.currentTime) * 20);
                    if (p > 100) p = 100;
                    fill.style.width = p + "%";
                    stat.innerText = "BUFFERING: " + p + "%";
                    if (p > 15) {
                        stat.innerText = "SINYAL TERKUNCI";
                        setTimeout(() => { if(!v.paused) info.style.display = 'none'; }, 3000);
                    }
                }
            };
        }

        window.addEventListener('keydown', (e) => {
            // PR/CH Up-Down
            if (e.key === "ArrowUp") play(cur - 1);
            if (e.key === "ArrowDown") play(cur + 1);
            
            // Tombol OK (Enter) untuk Daftar Channel
            if (e.key === "Enter") {
                sidebar.style.display = (sidebar.style.display === 'flex') ? 'none' : 'flex';
            }

            // Input Nomor / Kode
            if (/[0-9]/.test(e.key)) {
                b += e.key;
                numOver.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "1062") {
                        load(mode === "AVS2" ? "https://iptv-org.github.io/iptv/categories/kids.m3u" : "https://iptv-org.github.io/iptv/languages/ind.m3u");
                    } else if (b === "0000") {
                        mode = (mode === "AVS1") ? "AVS2" : "AVS1";
                        load(mode === "AVS2" ? "https://iptv-org.github.io/iptv/categories/kids.m3u" : "https://iptv-org.github.io/iptv/languages/ind.m3u");
                    } else {
                        let target = parseInt(b) - 1;
                        if (ch[target]) play(target);
                    }
                    b = ""; numOver.innerText = "";
                }, 1000);
            }
        });

        load("https://iptv-org.github.io/iptv/languages/ind.m3u");
    </script>
</body>
</html>
