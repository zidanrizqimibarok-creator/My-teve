<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AAA3 SET A BOX - V45</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: sans-serif; color: #00fbff; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        
        /* ASLI V11 */
        #num { position: absolute; top: 10px; left: 10px; font-size: 80px; font-weight: bold; z-index: 99; }
        #info { 
            position: absolute; bottom: 50px; left: 50px; 
            padding: 10px 20px; border-left: 10px solid #00fbff;
            background: rgba(0,0,0,0.7); display: none; z-index: 99;
        }

        /* TAMBAHAN AAA3: Booting */
        #boot {
            position: fixed; top:0; left:0; width:100%; height:100%; background:#000;
            display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;
        }
        .logo { font-size: 3rem; font-weight:900; letter-spacing:10px; }

        /* TAMBAHAN AAA3: Sinyal Teracak Tengah */
        #alert-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; background: rgba(255, 0, 0, 0.8); color: white;
            border: 4px solid white; border-radius: 15px; font-size: 2rem; font-weight: bold;
            display: none; z-index: 100; text-align: center;
        }

        /* TAMBAHAN AAA3: Progress Bar di Kotak Info */
        #bar-bg { width: 100%; height: 8px; background: #222; margin-top: 10px; border-radius: 4px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #00fbff; transition: 0.3s; }
    </style>
</head>
<body onclick="v.play()">

    <div id="boot" id="boot-screen">
        <div class="logo">AAA3 SET A BOX</div>
        <p style="margin-top:20px; font-size:12px;">LOADING SYSTEM V45...</p>
    </div>

    <div id="num"></div>
    
    <div id="alert-center">⚠️ SINYAL TERACAK</div>

    <div id="info">
        <h2 id="n"></h2>
        <p>DIGITAL TV - AAA3</p>
        <div id="bar-bg"><div id="bar-fill"></div></div>
        <p id="buf-txt" style="font-size:12px; margin-top:5px;">Buffer 0%</p>
    </div>

    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const num = document.getElementById('num');
        const info = document.getElementById('info');
        const n = document.getElementById('n');
        const alertBox = document.getElementById('alert-center');
        const bar = document.getElementById('bar-fill');
        const btxt = document.getElementById('buf-txt');
        
        let ch = [];
        let cur = 0;
        let b = "";
        let h = new Hls();
        let mode = "AVS1"; // Default AVS1

        // BOOTING TIMER (5 DETIK)
        setTimeout(() => { document.getElementById('boot').style.display = 'none'; }, 5000);

        // FUNGSI LOAD (DITAMBAH LOGIKA AVS)
        function load() {
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url)
                .then(r => r.text())
                .then(d => {
                    ch = []; // Clear dulu sebelum isi
                    const lines = d.split('\n');
                    for (let i = 0; i < lines.length; i++) {
                        if (lines[i].includes('#EXTINF')) {
                            ch.push({ 
                                name: lines[i].split(',')[1].trim(), 
                                url: lines[i+1].trim() 
                            });
                        }
                    }
                    if(ch.length > 0) play(0);
                });
        }

        function play(i) {
            if (i < 0) i = ch.length - 1;
            if (i >= ch.length) i = 0;
            cur = i;

            alertBox.style.display = 'none';
            n.innerText = (i + 1) + ". " + ch[i].name;
            info.style.display = 'block';
            
            // Engine Tetap V11 (Ringan)
            if (h) h.destroy();
            h = new Hls({
                capLevelToPlayerSize: true,
                maxBufferLength: 5,
                enableWorker: false
            });
            
            h.loadSource(ch[i].url);
            h.attachMedia(v);
            h.on(Hls.Events.MANIFEST_PARSED, () => v.play());
            
            // ERROR HANDLING (SINYAL TERACAK)
            h.on(Hls.Events.ERROR, (e, data) => {
                if(data.fatal) alertBox.style.display = 'block';
            });

            // REAL BUFFER MONITOR
            v.onprogress = () => {
                if (v.buffered.length > 0) {
                    let p = Math.round((v.buffered.end(0) - v.currentTime) * 20);
                    if (p > 100) p = 100;
                    bar.style.width = p + "%";
                    btxt.innerText = "Buffer " + p + "%";
                    if (p > 15) {
                        setTimeout(() => { info.style.display = 'none'; }, 3000);
                    }
                }
            };
        }

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            // Navigasi PR/CH Asli V6/V11
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") play(cur - 1);

            if (/[0-9]/.test(e.key)) {
                b += e.key;
                num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    // TAMBAHAN KODE SAKTI AAA3
                    if (b === "0000") {
                        mode = (mode === "AVS1") ? "AVS2" : "AVS1";
                        load();
                    } else if (b === "1062") {
                        load();
                    } else {
                        let target = parseInt(b) - 1;
                        if (ch[target]) play(target);
                    }
                    b = ""; num.innerText = "";
                }, 800);
            }
        });

        load(); // Jalankan pertama kali
    </script>
</body>
</html>
