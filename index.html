<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V33 - PRO LIGHT</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: sans-serif; color: #00fbff; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        
        #num { position: absolute; top: 10px; left: 10px; font-size: 80px; font-weight: bold; z-index: 99; }
        
        #info { 
            position: absolute; bottom: 50px; left: 50px; 
            padding: 10px 20px; border-left: 10px solid #00fbff;
            background: rgba(0,0,0,0.8); display: none; z-index: 98;
        }

        /* Menu Scroll - Tetap Ringan */
        #menu {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 400px; height: 60vh; background: rgba(0,0,0,0.95);
            border: 2px solid #00fbff; display: none; flex-direction: column; z-index: 100;
        }
        .m-head { padding: 15px; background: #00fbff; color: #000; font-weight: bold; text-align: center; }
        .m-list { overflow-y: auto; flex: 1; padding: 5px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; }
        .m-item:hover { background: #00fbff; color: #000; }
        .m-num { width: 40px; font-weight: bold; }
    </style>
</head>
<body onclick="v.play()">

    <div id="num"></div>
    <div id="info"><h2 id="n"></h2><p>DIGITAL TV - V33</p></div>
    
    <div id="menu">
        <div class="m-head">DAFTAR CH (1111)</div>
        <div class="m-list" id="mlist"></div>
    </div>

    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const num = document.getElementById('num');
        const info = document.getElementById('info');
        const n = document.getElementById('n');
        const mlist = document.getElementById('mlist');
        const menu = document.getElementById('menu');
        
        let ch = []; let cur = 0; let b = ""; let h = new Hls(); let mode = "AVS1";

        function load(url) {
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); ch = []; mlist.innerHTML = "";
                let count = 0;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        let name = lines[i].split(',')[1].trim();
                        let url = lines[i+1].trim();
                        ch.push({ name, url });
                        
                        let item = document.createElement('div');
                        item.className = "m-item";
                        item.innerHTML = `<span class="m-num">${count+1}</span><span>${name}</span>`;
                        let idx = count;
                        item.onclick = () => { play(idx); menu.style.display = 'none'; };
                        mlist.appendChild(item);
                        count++;
                    }
                }
                if (ch.length > 0) play(0);
            });
        }

        function play(i) {
            if (i < 0) i = ch.length - 1;
            if (i >= ch.length) i = 0;
            cur = i;

            n.innerText = (i + 1) + ". " + ch[i].name;
            info.style.display = 'block';
            setTimeout(() => { info.style.display = 'none'; }, 3000);

            if (h) h.destroy();
            h = new Hls({ maxBufferLength: 10, enableWorker: false });
            h.loadSource(ch[i].url);
            h.attachMedia(v);
            h.on(Hls.Events.MANIFEST_PARSED, () => v.play());
        }

        window.addEventListener('keydown', (e) => {
            if (/[0-9]/.test(e.key)) {
                b += e.key;
                num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "1111") {
                        menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
                    } else if (b === "0000") {
                        mode = (mode === "AVS1") ? "AVS2" : "AVS1";
                        load(mode === "AVS2" ? "https://iptv-org.github.io/iptv/categories/kids.m3u" : "https://iptv-org.github.io/iptv/languages/ind.m3u");
                    } else {
                        let target = parseInt(b) - 1;
                        if (ch[target]) play(target);
                    }
                    b = ""; num.innerText = "";
                }, 800);
            }
        });

        load("https://iptv-org.github.io/iptv/languages/ind.m3u");
    </script>
</body>
</html>
