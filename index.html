<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V11 - AAA3 V56 JADUL EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        /* STYLE TV TABUNG 2012 */
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { 
            font-family: 'Courier New', Courier, monospace; 
            color: #00fbff;
            text-shadow: 2px 2px #000, 0 0 10px rgba(0,251,255,0.5);
        }
        
        /* Efek Garis TV Jadul */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        video { width: 100vw; height: 100vh; object-fit: contain; }
        
        #num { 
            position: absolute; top: 30px; right: 50px; 
            font-size: 100px; font-weight: bold; color: #00fbff; z-index: 99; 
        }

        /* KOTAK OSD JADUL */
        #info { 
            position: absolute; bottom: 60px; left: 60px; 
            padding: 20px; border: 4px solid #00fbff;
            background: rgba(0, 40, 40, 0.8); z-index: 99;
            display: none; width: 400px;
        }

        #scan-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; padding: 30px; background: #002222; border: 6px double #00fbff;
            display: none; z-index: 1000; text-align: center;
        }

        #shortcut {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 70%; background: rgba(0, 20, 20, 0.95); border: 2px solid #00fbff;
            display: none; z-index: 500; padding: 20px; overflow-y: auto;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
        }
        .sc-item { padding: 10px; border: 1px solid #005555; color: #008888; font-size: 14px; }
        .sc-item.focus { background: #00fbff; color: #000; }

        #usb-input { display: none; }
        #alert-center { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: #ff0000; font-weight: bold; background: #000; 
            padding: 20px; border: 4px solid #ff0000; display: none; z-index: 100;
        }
    </style>
</head>
<body onclick="document.documentElement.requestFullscreen(); v.play();">

    <div id="num"></div>
    <div id="alert-center">SINYAL TERACAK</div>
    <input type="file" id="usb-input" accept=".m3u,.mp4,.mkv">
    
    <div id="scan-ui">
        <h2 style="margin-bottom:10px;">AUTO SCANNING 2012</h2>
        <div id="scan-perc" style="font-size: 40px;">0%</div>
        <div style="margin: 15px 0;">
            <span style="color:#00fbff;">AKTIF: <span id="sc-good">0</span></span>
        </div>
        <p id="sc-name" style="font-size:12px; color:#aaa;">SEARCHING...</p>
    </div>

    <div id="shortcut"></div>

    <div id="info">
        <h2 id="n" style="font-size: 2.5rem; margin-bottom: 10px;"></h2>
        <div style="border: 2px solid #00fbff; height: 15px; margin-bottom: 10px;">
            <div id="bar-fill" style="width:0%; height:100%; background:#00fbff;"></div>
        </div>
        <p id="btxt" style="font-size: 18px; color: yellow;">STATUS: LOADING 10s</p>
    </div>

    <video id="v" playsinline autoplay></video>
    <video id="test-v" style="display:none;" muted></video>

    <script>
        const v = document.getElementById('v');
        const tv = document.getElementById('test-v');
        const h = new Hls(); const th = new Hls();
        const info = document.getElementById('info');
        const btxt = document.getElementById('btxt');
        const usbIn = document.getElementById('usb-input');
        
        let ch = [], fullCh = [], cur = 0, scIdx = 0, b = "", timerCD, count = 10;

        // LOAD DATA PERMANEN DARI MEMORI
        function init() {
            const saved = localStorage.getItem('aaa3_channels');
            fetch("https://iptv-org.github.io/iptv/languages/ind.m3u")
                .then(r => r.text())
                .then(d => {
                    const lines = d.split('\n'); let temp = [];
                    for (let i = 0; i < lines.length; i++) {
                        if (lines[i].includes('#EXTINF')) temp.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                    }
                    fullCh = [...temp];
                    if (saved) {
                        ch = JSON.parse(saved);
                    } else {
                        ch = [...temp];
                    }
                    play(0);
                });
        }

        async function deepScan() {
            document.getElementById('scan-ui').style.display = 'block';
            let good = 0, checked = [];
            for(let i=0; i < ch.length; i++) {
                document.getElementById('scan-perc').innerText = Math.round((i/ch.length)*100) + "%";
                document.getElementById('sc-name').innerText = "LOCKING: " + ch[i].name;

                let isAlive = await new Promise((res) => {
                    th.loadSource(ch[i].url); th.attachMedia(tv);
                    let t = setTimeout(() => { th.stopLoad(); res(false); }, 4000);
                    th.once(Hls.Events.FRAG_BUFFERED, () => { clearTimeout(t); res(true); });
                    th.once(Hls.Events.ERROR, () => { clearTimeout(t); res(false); });
                });

                if(isAlive) { good++; checked.push(ch[i]); }
                document.getElementById('sc-good').innerText = good;
            }
            ch = checked;
            localStorage.setItem('aaa3_channels', JSON.stringify(ch)); // SIMPAN PERMANEN
            document.getElementById('scan-ui').style.display = 'none';
            play(0);
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i; document.getElementById('shortcut').style.display = 'none';
            document.getElementById('alert-center').style.display = 'none';
            document.getElementById('n').innerText = "CH " + (i + 1) + " " + ch[i].name;
            
            info.style.display = 'block';
            clearInterval(timerCD);
            count = 10;
            btxt.innerText = "STATUS: LOADING " + count + "s";
            btxt.style.color = "yellow";

            h.loadSource(ch[i].url); h.attachMedia(v);

            timerCD = setInterval(() => {
                count--;
                if(count >= 0) {
                    btxt.innerText = "STATUS: LOADING " + count + "s";
                } else {
                    clearInterval(timerCD);
                    // KOTAK INFO TETAP ADA SAMPAI TIMER HABIS
                    if(!v.paused && v.readyState > 2) {
                        btxt.innerText = "STATUS: SIGNAL OK";
                        btxt.style.color = "#00fbff";
                        document.getElementById('bar-fill').style.width = "100%";
                    } else {
                        document.getElementById('alert-center').style.display = 'block';
                        btxt.innerText = "STATUS: NO SIGNAL";
                        btxt.style.color = "red";
                    }
                    setTimeout(() => { info.style.display = 'none'; }, 2000);
                }
            }, 1000);
        }

        // USB READER 2701
        usbIn.onchange = (e) => {
            const file = e.target.files[0];
            const url = URL.createObjectURL(file);
            if(file.name.endsWith('.m3u')) {
                // Logika baca m3u dari USB bisa ditambah di sini
                alert("M3U USB Terdeteksi!");
            } else {
                ch = [{name: "USB: " + file.name, url: url}];
                play(0);
            }
        };

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (c == 33 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || e.key == "ArrowDown") {
                if (b === "82") { 
                    localStorage.removeItem('aaa3_channels'); // RESET PERMANEN
                    ch = [...fullCh]; play(0); b = ""; 
                } else { play(cur - 1); }
            }
            if (/[0-9]/.test(e.key)) {
                b += e.key; document.getElementById('num').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "7091") { document.getElementById('shortcut').style.display = 'grid'; }
                    else if (b === "1062") deepScan();
                    else if (b === "2701") usbIn.click(); // Shortcut USB
                    else if (b !== "82") { let t = parseInt(b)-1; if(ch[t]) play(t); }
                    if (b !== "82") { b = ""; document.getElementById('num').innerText = ""; }
                }, 800);
            }
        });
        init();
    </script>
</body>
</html>
