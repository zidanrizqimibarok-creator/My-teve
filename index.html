<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V12 - FINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Memaksa Fullscreen Tanpa Celah */
        * { margin: 0; padding: 0; border: 0; overflow: hidden; background: #000; }
        body, html { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        /* Video memenuhi seluruh layar TV */
        video { 
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; 
            object-fit: fill; /* fill = Paksa Fullscreen | contain = Original Ratio */
        }
        
        #num { 
            position: absolute; top: 30px; left: 30px; 
            font-size: 100px; font-weight: bold; color: #00fbff; z-index: 100;
            font-family: 'Courier New', monospace;
        }

        #osd {
            position: absolute; bottom: 10%; left: 5%;
            padding: 20px 40px; border-left: 10px solid #00fbff;
            background: rgba(0,0,0,0.8); z-index: 90; display: none;
        }
    </style>
</head>
<body onclick="startFull()">

    <div id="num"></div>
    <div id="osd">
        <h1 id="ch-name" style="color: white; font-size: 3rem;"></h1>
        <p style="color: #00fbff; font-weight: bold;">SIGNAL: DIGITAL STABLE</p>
    </div>
    
    <video id="tv" playsinline autoplay></video>

    <script>
        const tv = document.getElementById('tv');
        const num = document.getElementById('num');
        const osd = document.getElementById('osd');
        const chName = document.getElementById('ch-name');
        
        let channels = [];
        let current = 0;
        let buffer = "";
        let hls = new Hls();

        // Ambil Data - Pakai Multi-Source agar Sinyal Lebih Banyak yang Ada
        const sourceUrl = "https://iptv-org.github.io/iptv/languages/ind.m3u";

        fetch(sourceUrl)
            .then(r => r.text())
            .then(data => {
                const lines = data.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        const name = lines[i].split(',')[1].trim();
                        const url = lines[i+1].trim();
                        if(url.startsWith('http')) channels.push({ name, url });
                    }
                }
                play(0);
            });

        function play(idx) {
            if (idx < 0) idx = channels.length - 1;
            if (idx >= channels.length) idx = 0;
            current = idx;

            // Tampilkan Info Saluran
            chName.innerText = (idx + 1) + ". " + channels[idx].name;
            osd.style.display = 'block';
            clearTimeout(window.oTimer);
            window.oTimer = setTimeout(() => osd.style.display = 'none', 4000);

            // Engine Start
            if (hls) hls.destroy();
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 0 // Hemat RAM TV
            });

            hls.loadSource(channels[idx].url);
            hls.attachMedia(tv);
            hls.on(Hls.Events.MANIFEST_PARSED, () => tv.play());

            // AUTO-FIX: Jika sinyal hilang (error), coba reconnect otomatis
            hls.on(Hls.Events.ERROR, (e, data) => {
                if (data.fatal) {
                    console.log("Signal Lost, Reconnecting...");
                    hls.startLoad();
                }
            });
        }

        // Handle Fullscreen & Play
        function startFull() {
            if (tv.requestFullscreen) tv.requestFullscreen();
            else if (tv.webkitRequestFullscreen) tv.webkitRequestFullscreen();
            tv.play();
        }

        // Navigasi Remote
        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            // PR/CH Keys
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(current + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") play(current - 1);

            // Angka Shortcut
            if (/[0-9]/.test(e.key)) {
                buffer += e.key;
                num.innerText = buffer;
                clearTimeout(window.nTimer);
                window.nTimer = setTimeout(() => {
                    let target = parseInt(buffer) - 1;
                    if (channels[target]) play(target);
                    buffer = ""; num.innerText = "";
                }, 800);
            }
        });
    </script>
</body>
</html>
