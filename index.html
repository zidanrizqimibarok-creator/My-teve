<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V11 - AAA3 V50 PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        /* ASLI V11 */
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: sans-serif; color: #00fbff; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        #num { position: absolute; top: 10px; left: 10px; font-size: 80px; font-weight: bold; z-index: 99; }
        #info { 
            position: absolute; bottom: 50px; left: 50px; 
            padding: 10px 20px; border-left: 10px solid #00fbff;
            background: rgba(0,0,0,0.7); display: none; z-index: 99;
        }

        /* AAA3: Scan & Shortcut Style */
        #boot { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        #alert-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; background: rgba(255, 0, 0, 0.8); color: white; border: 4px solid white; border-radius: 15px; font-size: 2rem; font-weight: bold; display: none; z-index: 100; text-align: center; }
        
        #scan-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 450px; padding: 30px; background: #050505; border: 4px solid #00fbff;
            display: none; z-index: 1000; text-align: center; border-radius: 20px;
        }

        #shortcut {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 75%; background: rgba(0,0,0,0.95); border: 2px solid #00fbff;
            display: none; z-index: 500; padding: 20px; overflow-y: auto;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
        }
        .sc-item { padding: 15px; border: 1px solid #222; color: #555; border-radius: 5px; text-align: left; }
        .sc-item.focus { border-color: #00fbff; color: #00fbff; background: rgba(0,251,255,0.1); }

        #bar-bg { width: 200px; height: 8px; background: #222; margin-top: 10px; border-radius: 4px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #00fbff; transition: 0.3s; }
    </style>
</head>
<body onclick="document.documentElement.requestFullscreen(); v.play();">

    <div id="boot"><h1 style="letter-spacing:10px;">AAA3 SET A BOX</h1></div>
    <div id="num"></div>
    <div id="alert-center">⚠️ SINYAL TERACAK</div>
    
    <div id="scan-ui">
        <h2 style="color:#00fbff;">SCANNING SATELIT...</h2>
        <div style="display:flex; justify-content:space-around; margin:20px 0;">
            <div style="color:red;">RUSAK: <span id="sc-bad">0</span></div>
            <div style="color:#00fbff;">AKTIF: <span id="sc-good">0</span></div>
        </div>
        <div id="sc-name" style="font-size:12px; color:#666;">Silahkan Tunggu...</div>
    </div>

    <div id="shortcut"></div>

    <div id="info">
        <h2 id="n"></h2>
        <p>DIGITAL TV - AAA3</p>
        <div id="bar-bg"><div id="bar-fill"></div></div>
        <p id="btxt" style="font-size: 10px; margin-top: 5px;">BUFFER: 0%</p>
    </div>

    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const num = document.getElementById('num');
        const info = document.getElementById('info');
        const n = document.getElementById('n');
        const bar = document.getElementById('bar-fill');
        const btxt = document.getElementById('btxt');
        const alertBox = document.getElementById('alert-center');
        const scBox = document.getElementById('shortcut');
        const scanUI = document.getElementById('scan-ui');
        
        let ch = []; let fullCh = []; let cur = 0; let scIdx = 0; let b = "";
        let h = new Hls(); let isSc = false; let mode = "AVS1";

        setTimeout(() => { document.getElementById('boot').style.display = 'none'; }, 5000);

        function load() {
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); let temp = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        temp.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim(), dead: false });
                    }
                }
                fullCh = [...temp]; ch = [...temp];
                play(0);
            });
        }

        async function doScan() {
            scanUI.style.display = 'block';
            let bad = 0; let good = 0;
            for(let i=0; i < ch.length; i++){
                document.getElementById('sc-name').innerText = "Cek: " + ch[i].name;
                try {
                    const res = await fetch(ch[i].url, { method: 'HEAD', mode: 'no-cors' });
                    good++; document.getElementById('sc-good').innerText = good;
                } catch(e) {
                    bad++; document.getElementById('sc-bad').innerText = bad;
                    ch[i].dead = true;
                }
                if(i % 5 === 0) await new Promise(r => setTimeout(r, 10)); // Biar gak lag
            }
            ch = ch.filter(item => !item.dead);
            scanUI.style.display = 'none';
            play(0);
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i; isSc = false; scBox.style.display = 'none'; alertBox.style.display = 'none';
            n.innerText = (i + 1) + ". " + ch[i].name;
            info.style.display = 'block';
            if (h) h.destroy();
            h = new Hls({ maxBufferLength: 5, enableWorker: false });
            h.loadSource(ch[i].url); h.attachMedia(v);
            h.on(Hls.Events.ERROR, (e, d) => { if(d.fatal) alertBox.style.display = 'block'; });
            v.onprogress = () => {
                if (v.buffered.length > 0) {
                    let p = Math.round((v.buffered.end(0) - v.currentTime) * 20);
                    if (p > 100) p = 100;
                    bar.style.width = p + "%"; btxt.innerText = "BUFFER: " + p + "%";
                    if (p > 15) setTimeout(() => { info.style.display = 'none'; }, 3000);
                }
            };
        }

        function openShortcut() {
            isSc = true; scBox.innerHTML = ""; scBox.style.display = 'grid';
            ch.forEach((item, i) => {
                let d = document.createElement('div');
                d.className = "sc-item" + (i === scIdx ? " focus" : "");
                d.innerHTML = `<span style="color:#00fbff">${i+1}.</span> ${item.name}`;
                scBox.appendChild(d);
            });
            scBox.children[scIdx].scrollIntoView({ block: "center", behavior: "smooth" });
        }

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (isSc) {
                if (c == 33 || c == 427 || e.key == "ArrowUp") { scIdx = (scIdx > 0) ? scIdx - 1 : ch.length - 1; openShortcut(); }
                if (c == 34 || c == 428 || e.key == "ArrowDown") { scIdx = (scIdx < ch.length - 1) ? scIdx + 1 : 0; openShortcut(); }
                if (e.key == "0") play(scIdx); // Tombol 0 buat OK
                return;
            }

            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") play(cur - 1);

            if (/[0-9]/.test(e.key)) {
                b += e.key; num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "7091") { scIdx = cur; openShortcut(); }
                    else if (b === "1062") doScan();
                    else if (b === "1083") { ch = [...fullCh]; play(0); }
                    else if (b === "0000") { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
                    else { let t = parseInt(b)-1; if(ch[t]) play(t); }
                    b = ""; num.innerText = "";
                }, 800);
            }
        });

        load();
    </script>
</body>
</html>
