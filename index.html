<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CONECTA OS V80</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        * { margin:0; padding:0; overflow:hidden; background:transparent; cursor: none; color: #00ff88; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; }

        /* VIDEO FULL SCREEN PAKSA */
        #v { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }

        /* LOGO HD GERAK */
        #logo-conecta { position: absolute; top: 30px; right: 40px; z-index: 500; text-align: right; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px #ffcc00; } }
        .hd-tag { font-size: 12px; background: #ffcc00; color: #000; padding: 2px 6px; font-weight: bold; border-radius: 3px; }
        .con-text { font-size: 2.2rem; font-weight: 900; color: #ffcc00; border-bottom: 4px solid #00ff88; display: block; }

        /* HOME SCREEN & SETTINGS (TRANSPARAN LATAR BELAKANG TV) */
        #home, #settings-ui { 
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.8); /* Latar transparan supaya TV kelihatan */
            z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }

        .menu-row { display: flex; gap: 30px; }
        .card { 
            width: 200px; height: 180px; border: 4px solid #333; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05); transition: 0.3s;
        }
        .card.active { border-color: #00ff88; background: rgba(0,255,136,0.3); transform: scale(1.1); }

        /* SCAN ANALYZER DI SETTINGS */
        #scan-list { margin-top: 20px; width: 80%; text-align: left; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .ch-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #222; font-size: 14px; }
        .status-on { color: #00ff88; font-weight: bold; }
        .status-off { color: #ff4444; font-weight: bold; }

        /* UI LAIN */
        #browser-ui { position: fixed; inset: 0; z-index: 1100; display: none; background: #fff; }
        #info { position:absolute; bottom:50px; left:50px; padding:30px; background: rgba(0,20,10,0.9); z-index:99; width:600px; display:none; border-left: 10px solid #00ff88; }
        #loading-bar { width: 0%; height: 8px; background: #ffcc00; transition: width 0.3s; margin-top: 15px; }
        #num { position: absolute; top: 40px; left: 40px; font-size: 100px; color: rgba(0,255,136,0.2); font-weight: 900; z-index: 100; }
    </style>
</head>
<body onclick="startOS()">

    <video id="v" autoplay playsinline></video>

    <div id="home">
        <h1 style="color: #ffcc00; font-size: 3rem; margin-bottom: 30px;">CONECTA OS</h1>
        <div class="menu-row">
            <div class="card active" id="m0"><i>📺</i><h2>TV MODE</h2></div>
            <div class="card" id="m1"><i>🌐</i><h2>BROWSER</h2></div>
            <div class="card" id="m2"><i>⚙️</i><h2>SETTINGS</h2></div>
        </div>
    </div>

    <div id="settings-ui">
        <h1 style="color:#ffcc00">SYSTEM SETTINGS</h1>
        <div id="scan-list">
            <h3 style="border-bottom: 2px solid #00ff88; padding-bottom: 10px;">CHANNEL ANALYZER (UJI COBA)</h3>
            <div id="list-content">Scanning signals...</div>
        </div>
        <p style="margin-top:20px;">TEKAN [0] UNTUK KEMBALI</p>
    </div>

    <div id="browser-ui">
        <iframe src="https://www.google.com/search?igu=1" style="width:100%; height:100vh; border:none;"></iframe>
    </div>

    <div id="logo-conecta"><span class="hd-tag">HD</span><span class="con-text">CONECTA TV</span></div>
    <div id="num"></div>
    
    <div id="info">
        <h1 id="n"></h1>
        <p id="m-txt" style="color:#ffcc00"></p>
        <div id="loading-bar"></div>
    </div>

    <script>
        const v = document.getElementById('v');
        const h = new Hls();
        let ch = [], cur = 0, b = "", mode = "AVS1", menuIdx = 0, currentApp = 'home';

        function startOS() { openApp('home'); load(); }

        function openApp(app) {
            currentApp = app;
            document.getElementById('home').style.display = (app === 'home') ? 'flex' : 'none';
            document.getElementById('settings-ui').style.display = (app === 'settings') ? 'flex' : 'none';
            document.getElementById('browser-ui').style.display = (app === 'browser') ? 'block' : 'none';
            if(app === 'settings') runAnalyzer();
        }

        function runAnalyzer() {
            const content = document.getElementById('list-content');
            content.innerHTML = "Memeriksa 5 Channel Terbaru...";
            let html = "";
            // Simulasi Uji Coba 5 Channel
            for(let i=0; i<5; i++) {
                if(ch[i]) {
                    let status = (Math.random() > 0.3) ? "ACTIVE" : "OFFLINE";
                    let color = (status === "ACTIVE") ? "status-on" : "status-off";
                    html += `<div class="ch-item"><span>${ch[i].name}</span><span class="${color}">${status}</span></div>`;
                }
            }
            setTimeout(() => { content.innerHTML = html; }, 1000);
        }

        function play(i) {
            if (ch.length === 0) return;
            cur = (i < 0) ? ch.length - 1 : (i >= ch.length) ? 0 : i;
            h.loadSource(ch[cur].url); h.attachMedia(v);
            showInfo();
        }

        function showInfo() {
            document.getElementById('info').style.display = 'block';
            document.getElementById('n').innerText = (cur+1) + ". " + ch[cur].name;
            document.getElementById('m-txt').innerText = "CONECTA HD ENGINE";
            document.getElementById('loading-bar').style.width = "0%";
            setTimeout(() => { document.getElementById('loading-bar').style.width = "100%"; }, 100);
            setTimeout(() => { document.getElementById('info').style.display = 'none'; }, 3000);
        }

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            const key = e.key;

            if (currentApp === 'browser' && key === "1") { openApp('home'); return; }
            if (currentApp === 'settings' && key === "0") { openApp('home'); return; }

            if (currentApp === 'home') {
                if (c == 33 || c == 427 || key == "ArrowUp") { menuIdx = (menuIdx + 1) % 3; updateMenu(); }
                if (c == 34 || c == 428 || key == "ArrowDown") { menuIdx = (menuIdx - 1 + 3) % 3; updateMenu(); }
            }

            if (/[0-9]/.test(key)) {
                b += key;
                document.getElementById('num').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (currentApp === 'home' && b.length === 1) {
                        if (b === "1") openApp('tv');
                        if (b === "2") openApp('browser');
                        if (b === "3") openApp('settings');
                    } else if (b === "0000") { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
                    else if (b === "1111") openApp('home');
                    else if (b === "82") location.reload();
                    else {
                        let target = parseInt(b) - 1;
                        if (ch[target]) { openApp('tv'); play(target); }
                    }
                    b = ""; document.getElementById('num').innerText = "";
                }, 700);
            }

            if (currentApp === 'tv') {
                if (c == 33 || c == 427 || key == "ArrowUp") play(cur + 1);
                if (c == 34 || c == 428 || key == "ArrowDown") play(cur - 1);
            }
        });

        function updateMenu() {
            document.querySelectorAll('.card').forEach((m, i) => {
                m.className = (i === menuIdx) ? 'card active' : 'card';
            });
        }

        function load() {
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                ch = [];
                const lines = d.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) ch.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                }
                if(currentApp === 'tv') play(0);
            });
        }
    </script>
</body>
</html>
