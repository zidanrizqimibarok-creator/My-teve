<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII OS - Lite Streamer</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        body { background: #000; font-family: 'Segoe UI', sans-serif; cursor: none; color: white; }
        
        #tv-screen { position: relative; width: 100vw; height: 100vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* Input Nomor Atas Kiri */
        #input-display {
            position: absolute; top: 20px; left: 20px; font-size: 7rem;
            color: #00fbff; font-weight: bold; text-shadow: 4px 4px 20px #000;
            z-index: 100; font-family: monospace;
        }

        /* OSD Banner */
        #osd { 
            position: absolute; bottom: 8%; left: 5%; 
            background: rgba(0, 0, 0, 0.9); padding: 15px 40px; 
            border-left: 12px solid #00fbff; opacity: 0; transition: 0.2s; z-index: 10;
        }
        #osd.active { opacity: 1; }
        #osd h1 { font-size: 5rem; margin: 0; line-height: 1; }

        /* No Signal */
        #no-signal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #00008b; display: none; align-items: center; justify-content: center; z-index: 5;
        }
    </style>
</head>
<body onclick="initTV()">

    <div id="tv-screen">
        <div id="input-display"></div>
        <div id="no-signal"><h1>TIDAK ADA SINYAL</h1></div>

        <video id="video-player" playsinline autoplay></video>

        <div id="osd">
            <h1 id="osd-num">01</h1>
            <div id="osd-name" style="font-size: 2.5rem; font-weight: bold;">MEMUAT...</div>
            <div style="color: #00fbff; font-weight: bold; margin-top: 5px;">DIGITAL DTV</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-player');
        const osd = document.getElementById('osd');
        const noSignal = document.getElementById('no-signal');
        const inputDisplay = document.getElementById('input-display');
        
        let channels = [];
        let currentIndex = 0;
        let numBuffer = "";
        let hls = null;

        // Ambil Data M3U (Direct Load agar lebih cepat)
        fetch("https://iptv-org.github.io/iptv/languages/ind.m3u")
            .then(res => res.text())
            .then(data => {
                const lines = data.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        const name = lines[i].split(',')[1].trim();
                        const url = lines[i+1]?.trim();
                        if(url) channels.push({ name, url });
                    }
                }
                playChannel(0);
            }).catch(() => { noSignal.style.display = 'flex'; });

        function playChannel(index) {
            if (index < 0) index = channels.length - 1;
            if (index >= channels.length) index = 0;
            currentIndex = index;
            
            const ch = channels[index];
            noSignal.style.display = 'none';
            
            // UI Update Langsung (Nggak nunggu video)
            document.getElementById('osd-num').innerText = (index + 1).toString().padStart(2, '0');
            document.getElementById('osd-name').innerText = ch.name;
            osd.classList.add('active');
            clearTimeout(window.osdTimer);
            window.osdTimer = setTimeout(() => osd.classList.remove('active'), 3000);

            // Bersihkan engine lama total agar RAM TV lega
            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    manifestLoadingTimeOut: 5000,
                    fragLoadingTimeOut: 5000,
                    startLevel: 0 // Mulai dari kualitas rendah agar cepat muncul
                });
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                
                // Deteksi Error Fatal
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) noSignal.style.display = 'flex';
                });
            } else {
                video.src = ch.url;
                video.play();
            }

            // AUTO-REFRESH: Jika dalam 7 detik video nggak jalan, coba paksa putar lagi
            clearTimeout(window.refreshTimer);
            window.refreshTimer = setTimeout(() => {
                if (video.paused || video.readyState < 2) {
                    console.log("Retry loading...");
                    playChannel(currentIndex);
                }
            }, 7000);
        }

        window.addEventListener('keydown', (e) => {
            const code = e.keyCode;
            const key = e.key;

            // Navigasi PR/CH
            if (key === "ArrowUp" || code === 427 || code === 33) playChannel(currentIndex + 1);
            if (key === "ArrowDown" || code === 428 || code === 34) playChannel(currentIndex - 1);

            // Shortcut Angka
            if (/[0-9]/.test(key)) {
                numBuffer += key;
                inputDisplay.innerText = numBuffer;
                clearTimeout(window.numTimer);
                window.numTimer = setTimeout(() => {
                    const target = parseInt(numBuffer) - 1;
                    if (channels[target]) playChannel(target);
                    numBuffer = "";
                    inputDisplay.innerText = "";
                }, 800); // Respon angka dipercepat
            }
        });

        function initTV() {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            video.play();
        }
    </script>
</body>
</html>
