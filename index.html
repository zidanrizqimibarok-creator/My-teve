<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V11 - AAA3 V52 ULTRA SCAN</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        /* ASLI V11 */
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: 'Courier New', Courier, monospace; color: #00fbff; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        #num { position: absolute; top: 10px; left: 10px; font-size: 80px; font-weight: bold; z-index: 99; }
        #info { 
            position: absolute; bottom: 50px; left: 50px; 
            padding: 15px 25px; border-left: 8px solid #00fbff;
            background: rgba(0,10,20,0.8); display: none; z-index: 99;
        }

        /* NEW SCAN STYLE V52 */
        #scan-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; padding: 40px; background: rgba(0,5,10,0.95); 
            border: 2px solid #00fbff; box-shadow: 0 0 50px #00fbff;
            display: none; z-index: 1000; text-align: center; border-radius: 5px;
        }
        .scan-bar-container { width: 100%; height: 20px; background: #111; margin: 20px 0; border: 1px solid #333; }
        #scan-progress { width: 0%; height: 100%; background: linear-gradient(90deg, #005555, #00fbff); transition: 0.1s; }
        .stats { display: flex; justify-content: space-around; font-size: 1.2rem; font-weight: bold; }

        /* SHORTCUT 7091 */
        #shortcut {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 80%; background: rgba(0,0,0,0.98); border: 1px solid #00fbff;
            display: none; z-index: 500; padding: 20px; overflow-y: auto;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px;
        }
        .sc-item { padding: 12px; border: 1px solid #111; color: #333; transition: 0.2s; }
        .sc-item.focus { background: #00fbff; color: #000; font-weight: bold; transform: scale(1.02); }

        #boot { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body onclick="document.documentElement.requestFullscreen(); v.play();">

    <div id="boot"><h1 style="letter-spacing:15px; text-shadow: 0 0 20px #00fbff;">AAA3 SYSTEM</h1></div>
    <div id="num"></div>
    
    <div id="scan-ui">
        <div style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 10px;">AAA3 DEEP ANALYZER v52</div>
        <h2 style="letter-spacing: 5px;">SCANNING...</h2>
        <div class="scan-bar-container"><div id="scan-progress"></div></div>
        <div class="stats">
            <div style="color:#ff3b3b;">DEAD: <span id="sc-bad">0</span></div>
            <div style="color:#00fbff;">ALIVE: <span id="sc-good">0</span></div>
        </div>
        <div id="sc-name" style="margin-top:20px; font-size:10px; color:#555; white-space: nowrap; overflow: hidden;">Waiting...</div>
    </div>

    <div id="shortcut"></div>

    <div id="info">
        <h2 id="n" style="font-size: 2rem;"></h2>
        <p style="letter-spacing: 3px; font-size: 0.7rem;">AAA3 DIGITAL RECEIVER</p>
        <div style="width: 250px; height: 5px; background: #111; margin-top:10px;">
            <div id="bar-fill" style="width:0%; height:100%; background:#00fbff;"></div>
        </div>
        <p id="btxt" style="font-size: 10px; margin-top: 5px;">SIGNAL: 0%</p>
    </div>

    <video id="v" playsinline autoplay></video>
    <video id="test-v" style="display:none;" muted></video>

    <script>
        const v = document.getElementById('v');
        const tv = document.getElementById('test-v');
        const h = new Hls(); const th = new Hls();
        const scBox = document.getElementById('shortcut');
        const scanUI = document.getElementById('scan-ui');
        
        let ch = []; let fullCh = []; let cur = 0; let scIdx = 0; let b = "";
        let isSc = false; let mode = "AVS1";

        setTimeout(() => { document.getElementById('boot').style.display = 'none'; }, 5000);

        function load() {
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); let temp = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        temp.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                    }
                }
                fullCh = [...temp]; ch = [...temp];
                play(0);
            });
        }

        async function deepScan() {
            scanUI.style.display = 'block';
            let bad = 0; let good = 0; let checked = [];
            
            for(let i=0; i < ch.length; i++) {
                document.getElementById('sc-name').innerText = "V52 TESTING: " + ch[i].name;
                document.getElementById('scan-progress').style.width = ((i/ch.length)*100) + "%";
                
                let isAlive = await new Promise((resolve) => {
                    th.loadSource(ch[i].url);
                    th.attachMedia(tv);
                    
                    let timeout = setTimeout(() => { 
                        th.stopLoad(); 
                        resolve(false); 
                    }, 3500); // 3.5 detik untuk memastikan fragmen video masuk

                    th.once(Hls.Events.FRAG_BUFFERED, () => {
                        clearTimeout(timeout);
                        resolve(true);
                    });

                    th.once(Hls.Events.ERROR, () => {
                        clearTimeout(timeout);
                        resolve(false);
                    });
                });

                if(isAlive) { 
                    good++; document.getElementById('sc-good').innerText = good; 
                    checked.push(ch[i]); 
                } else { 
                    bad++; document.getElementById('sc-bad').innerText = bad; 
                }
            }
            ch = checked; 
            scanUI.style.display = 'none'; 
            play(0);
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i; isSc = false; scBox.style.display = 'none';
            document.getElementById('n').innerText = (i + 1) + ". " + ch[i].name;
            document.getElementById('info').style.display = 'block';
            h.loadSource(ch[i].url); h.attachMedia(v);
            
            v.onprogress = () => {
                if (v.buffered.length > 0) {
                    let p = Math.round((v.buffered.end(0) - v.currentTime) * 20);
                    if (p > 100) p = 100;
                    document.getElementById('bar-fill').style.width = p + "%";
                    document.getElementById('btxt').innerText = "SIGNAL: " + p + "%";
                    if (p > 15) setTimeout(() => { document.getElementById('info').style.display = 'none'; }, 3000);
                }
            };
        }

        function openShortcut() {
            isSc = true; scBox.innerHTML = ""; scBox.style.display = 'grid';
            ch.forEach((item, i) => {
                let d = document.createElement('div');
                d.className = "sc-item" + (i === scIdx ? " focus" : "");
                d.innerHTML = `[${i+1}] ${item.name}`;
                scBox.appendChild(d);
            });
            scBox.children[scIdx].scrollIntoView({ block: "center" });
        }

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (isSc) {
                if (c == 33 || c == 427 || e.key == "ArrowUp") { scIdx = (scIdx > 0) ? scIdx - 1 : ch.length - 1; openShortcut(); }
                if (c == 34 || c == 428 || e.key == "ArrowDown") { scIdx = (scIdx < ch.length - 1) ? scIdx + 1 : 0; openShortcut(); }
                if (e.key == "0") play(scIdx); 
                return;
            }

            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") play(cur - 1);

            if (/[0-9]/.test(e.key)) {
                b += e.key; document.getElementById('num').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "7091") { scIdx = cur; openShortcut(); }
                    else if (b === "1062") deepScan();
                    else if (b === "1083") { ch = [...fullCh]; play(0); }
                    else if (b === "0000") { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
                    else { let t = parseInt(b)-1; if(ch[t]) play(t); }
                    b = ""; document.getElementById('num').innerText = "";
                }, 800);
            }
        });

        load();
    </script>
</body>
</html>
