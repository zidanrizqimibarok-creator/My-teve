<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CONECTA TV V74 - FIX NEWS & BUFFER</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        * { margin:0; padding:0; overflow:hidden; background:#000; cursor: none; }
        body { font-family: 'Segoe UI', sans-serif; color:#00ff88; }
        
        #booting { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .boot-text { font-size: 3.5rem; font-weight: 900; color: #fff; letter-spacing: 8px; }

        #logo-conecta { position: absolute; top: 30px; right: 40px; font-size: 1.8rem; font-weight: 900; color: #ffcc00; z-index: 100; border-bottom: 3px solid #00ff88; padding-bottom: 5px; }

        /* SIDEBAR BERITA REAL-TIME */
        #sidebar { position: absolute; right: 20px; top: 100px; width: 260px; z-index: 105; display: flex; flex-direction: column; gap: 10px; }
        .notif-box { background: rgba(0, 15, 5, 0.9); border: 1px solid #00ff88; padding: 12px; border-left: 5px solid #ffcc00; animation: slideIn 0.5s ease-out; box-shadow: 0 4px 10px #000; }
        .notif-title { font-size: 10px; font-weight: bold; color: #ffcc00; text-transform: uppercase; margin-bottom: 5px; }
        .notif-msg { font-size: 11px; color: #fff; line-height: 1.4; }

        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }

        /* BUFFER DI DALAM KOTAK CH */
        .spinner {
            width: 20px; height: 20px; border: 3px solid rgba(0,255,136,0.3);
            border-top: 3px solid #00ff88; border-radius: 50%;
            animation: spin 0.8s linear infinite; display: inline-block;
            vertical-align: middle; margin-left: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        video { width:100vw; height:100vh; object-fit:contain; }
        
        /* Kotak Info Channel */
        #info { 
            position:absolute; bottom:50px; left:50px; padding:30px; 
            background: linear-gradient(90deg, rgba(0,40,20,0.95) 0%, rgba(0,0,0,0.85) 100%); 
            z-index:99; width:650px; display:none; border-left: 10px solid #00ff88;
        }

        #alert-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3rem; color:#ff0000; border:4px solid #ff0000; padding:30px; display:none; z-index:110; background:#000; font-weight:bold; text-align:center; }
        #num { position: absolute; top: 40px; left: 40px; font-size: 100px; color: rgba(0,255,136,0.25); font-weight: bold; z-index: 100; }
        #bar { width: 0%; height: 6px; background: #ffcc00; margin-top: 15px; transition: width 1s linear; box-shadow: 0 0 10px #ffcc00; }
    </style>
</head>
<body onclick="startTV()">

    <div id="booting"><div class="boot-text">CONECTA</div><div style="color:#00ff88; letter-spacing:3px;">LINK HD SYSTEM</div></div>
    <div id="logo-conecta">CONECTA TV</div>
    <div id="sidebar"></div>
    <div id="num"></div>
    <div id="alert-center">NO SIGNAL<br><small id="err-desc" style="font-size: 1.2rem; color:#fff;">MENCARI FREKUENSI...</small></div>
    
    <div id="info">
        <div style="display:flex; align-items:center;">
            <h1 id="n" style="font-size:2.5rem; color:#fff;"></h1>
            <div id="ch-loader" class="spinner"></div>
        </div>
        <p id="m-txt" style="color:#00ff88; font-weight:bold; font-size:14px; margin-top:5px;"></p>
        <div style="font-size:12px; color:#ffcc00; margin-top:10px;">SIGNAL STRENGTH: <span id="sig-val">0</span>%</div>
        <div style="background:#111; height:6px; margin-top:5px;"><div id="bar"></div></div>
    </div>

    <video id="v" autoplay playsinline></video>

    <script>
        const v = document.getElementById('v');
        const num = document.getElementById('num');
        const info = document.getElementById('info');
        const h = new Hls();
        let ch = [], cur = 0, b = "", mode = "AVS1", analogKill = false, signalTimer;

        function startTV() {
            document.getElementById('booting').style.display = 'none';
            document.documentElement.requestFullscreen();
            load();
            fetchNews();
            setInterval(fetchNews, 45000); 
        }

        function play(i) {
            if (ch.length === 0) return;
            if (i < 0) i = ch.length - 1; 
            if (i >= ch.length) i = 0;
            cur = i;
            
            const isAnalog = (i % 2 === 0);
            const isLocked = (analogKill && isAnalog);

            document.getElementById('n').innerText = (i+1) + ". " + ch[i].name;
            document.getElementById('m-txt').innerText = isAnalog ? "SIGNAL: ANALOG WAVE" : "SIGNAL: DIGITAL DTV HD";
            info.style.display = 'block';
            document.getElementById('ch-loader').style.display = 'inline-block';
            document.getElementById('alert-center').style.display = 'none';

            let strength = isAnalog ? 45 : 99;
            if(isLocked) strength = 0;
            document.getElementById('sig-val').innerText = strength;
            document.getElementById('bar').style.width = "0%";

            clearTimeout(signalTimer);
            if (isLocked) {
                h.stopLoad(); v.pause();
                document.getElementById('alert-center').style.display = 'block';
                document.getElementById('err-desc').innerText = "SYSTEM: ANALOG KILLED";
                document.getElementById('ch-loader').style.display = 'none';
            } else {
                h.loadSource(ch[i].url);
                h.attachMedia(v);
                
                // STICKY INFO: Kotak tidak hilang sampai 10 detik atau video jalan
                signalTimer = setTimeout(() => {
                    if (v.paused || v.readyState < 3) {
                        h.stopLoad();
                        document.getElementById('alert-center').style.display = 'block';
                        document.getElementById('err-desc').innerText = "LIMIT: 10S SIGNAL TIMEOUT";
                        document.getElementById('ch-loader').style.display = 'none';
                        // Baru boleh hilang setelah 3 detik tampil error
                        setTimeout(() => { info.style.display = 'none'; }, 3000);
                    }
                }, 10000); 
            }
        }

        // FIX BERITA REAL-TIME (Tanpa CORS Error)
        async function fetchNews() {
            try {
                const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://news.google.com/rss?hl=id&gl=ID&ceid=ID:id'));
                const json = await res.json();
                const parser = new DOMParser();
                const xml = parser.parseFromString(json.contents, "text/xml");
                const items = Array.from(xml.querySelectorAll("item")).slice(0, 15);
                const item = items[Math.floor(Math.random() * items.length)];
                showNotif("CONECTA NEWS", item.querySelector("title").textContent);
            } catch (e) {
                showNotif("SYSTEM", "Sinkronisasi berita tertunda...");
            }
        }

        function showNotif(title, msg) {
            const side = document.getElementById('sidebar');
            const box = document.createElement('div');
            box.className = 'notif-box';
            box.innerHTML = `<div class="notif-title">${title}</div><div class="notif-msg">${msg}</div>`;
            side.appendChild(box);
            setTimeout(() => { box.style.opacity = "0"; setTimeout(() => box.remove(), 500); }, 10000);
        }

        // --- KEYDOWN ASLI ZIDAN ---
        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") play(cur - 1);

            if (/[0-9]/.test(e.key)) {
                b += e.key;
                num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "999") { analogKill = !analogKill; play(cur); }
                    else if (b === "0000") { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
                    else {
                        let target = parseInt(b) - 1;
                        if (ch[target]) play(target);
                    }
                    b = ""; num.innerText = "";
                }, 700);
            }
        });

        v.onplaying = () => {
            clearTimeout(signalTimer);
            document.getElementById('ch-loader').style.display = 'none';
            document.getElementById('bar').style.width = "100%";
            // Info hilang 3 detik setelah video stabil
            setTimeout(() => { info.style.display = 'none'; }, 3000);
        };

        function load() {
            // Backup M3U jika utama gagal agar channel tidak kosong
            const m3u = "https://raw.githubusercontent.com/mizancok/iptv/master/indonesia.m3u";
            const fallback = "https://iptv-org.github.io/iptv/languages/ind.m3u";
            
            fetch(fallback).then(r => r.text()).then(d => {
                ch = [];
                const lines = d.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        const name = lines[i].split(',')[1].trim();
                        const url = lines[i+1] ? lines[i+1].trim() : "";
                        if(url.startsWith('http')) ch.push({ name, url });
                    }
                }
                if(ch.length > 0) play(0);
            }).catch(e => showNotif("ERROR", "Gagal memuat daftar channel."));
        }
    </script>
</body>
</html>
