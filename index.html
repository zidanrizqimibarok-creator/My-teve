<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V29 - Standalone</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        video { position: absolute; width: 100vw; height: 100vh; object-fit: fill; z-index: 1; }
        
        /* Menu Scroll TV */
        #menu-tv {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 400px; max-height: 500px; background: rgba(0, 5, 15, 0.95);
            border: 2px solid #00fbff; border-radius: 20px; z-index: 500;
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 251, 255, 0.3);
        }
        .menu-header { padding: 15px; background: #00fbff; color: #000; font-weight: bold; text-align: center; }
        .ch-list { overflow-y: auto; flex: 1; }
        .ch-item { 
            padding: 15px 20px; border-bottom: 1px solid #111; cursor: pointer;
            transition: 0.2s; display: flex; justify-content: space-between;
        }
        .ch-item:hover, .ch-item.active { background: #00fbff; color: #000; }
        
        #num-display { 
            position: absolute; top: 10%; right: 10%; font-size: 8rem; 
            color: #00fbff; font-weight: bold; z-index: 1000; display: none; 
        }

        #osd { 
            position: absolute; bottom: 5%; left: 5%; width: 90%; 
            background: rgba(0,0,0,0.8); padding: 15px; border-left: 8px solid #00fbff; 
            z-index: 10; display: none; 
        }

        /* Custom Scrollbar */
        .ch-list::-webkit-scrollbar { width: 8px; }
        .ch-list::-webkit-scrollbar-thumb { background: #00fbff; border-radius: 10px; }
    </style>
</head>
<body>
    <video id="tv" playsinline autoplay></video>
    <div id="num-display"></div>

    <div id="menu-tv">
        <div class="menu-header">DAFTAR CHANNEL (Kode: 1111)</div>
        <div class="ch-list" id="list-container">
            <div style="padding:20px; text-align:center;">Memuat satelit...</div>
        </div>
    </div>

    <div id="osd">
        <h2 id="ch-title">MENGHUBUNGKAN...</h2>
        <p id="status-txt" style="color:#00fbff;">Sinyal Terkunci</p>
    </div>

    <script>
        const tv = document.getElementById('tv');
        const menu = document.getElementById('menu-tv');
        const listContainer = document.getElementById('list-container');
        const numDisp = document.getElementById('num-display');
        const osd = document.getElementById('osd');
        
        let channels = [];
        let hls = new Hls();
        let inputCode = "";
        let inputTimeout;
        let currentAV = "AVS1";

        // Load Playlist Lokal (No Firebase)
        function fetchPlaylist() {
            const url = (currentAV === "AVS2") ? "https://iptv-org.github.io/iptv/categories/kids.m3u" : "https://iptv-org.github.io/iptv/languages/ind.m3u";
            fetch(url).then(r => r.text()).then(data => {
                const lines = data.split('\n');
                channels = [];
                listContainer.innerHTML = "";
                let count = 0;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        let name = lines[i].split(',')[1].trim();
                        let link = lines[i+1].trim();
                        channels.push({ name, link });
                        
                        let div = document.createElement('div');
                        div.className = "ch-item";
                        div.innerHTML = `<span>${count + 1}. ${name}</span> <small>LIVE</small>`;
                        let idx = count;
                        div.onclick = () => playChannel(idx);
                        listContainer.appendChild(div);
                        count++;
                    }
                }
            });
        }

        function playChannel(idx) {
            const ch = channels[idx];
            if(!ch) return;
            
            // Tutup menu otomatis setelah pilih
            menu.style.display = 'none';
            osd.style.display = 'block';
            document.getElementById('ch-title').innerText = ch.name;

            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(ch.link);
            hls.attachMedia(tv);
            
            tv.onplaying = () => {
                setTimeout(() => { osd.style.display = 'none'; }, 2000);
            };
        }

        // Handle Input Keyboard/Remote Fisik
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                inputCode += e.key;
                numDisp.innerText = inputCode;
                numDisp.style.display = 'block';
                
                clearTimeout(inputTimeout);
                inputTimeout = setTimeout(() => {
                    processCode(inputCode);
                    inputCode = "";
                    numDisp.style.display = 'none';
                }, 2000);
            }
        });

        function processCode(code) {
            // Kode 1111: Buka/Tutup Menu
            if (code === "1111") {
                menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
            }
            // Kode 0000: Ganti Mode AV
            else if (code === "0000") {
                currentAV = (currentAV === "AVS1") ? "AVS2" : "AVS1";
                fetchPlaylist();
            }
            // Angka Biasa: Pindah Channel
            else {
                let idx = parseInt(code) - 1;
                if (channels[idx]) playChannel(idx);
            }
        }

        // Start TV
        fetchPlaylist();
    </script>
</body>
</html>
