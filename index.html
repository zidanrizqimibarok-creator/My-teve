<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AAA3 SET A BOX - V40</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        body { background: #000; color: white; width: 100vw; height: 100vh; }
        
        /* HOME SCREEN */
        #home-screen {
            width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; position: absolute;
        }
        .logo-box { font-size: 2.5rem; font-weight: 900; margin-bottom: 50px; letter-spacing: 5px; color: #00fbff; }
        .icon-container { display: flex; gap: 30px; }
        .app-icon {
            width: 120px; height: 120px; background: rgba(255,255,255,0.1);
            border-radius: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            transition: 0.3s; border: 2px solid transparent;
        }
        .app-icon:hover, .app-icon.active { transform: scale(1.1); border-color: #00fbff; background: rgba(0,251,255,0.1); }
        .app-icon i { font-size: 3rem; margin-bottom: 10px; }
        .app-name { font-size: 0.9rem; font-weight: bold; }

        /* MODES (TV, SETTINGS, BROWSER, ETC) */
        .mode-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 500; background: #000; }
        
        /* SETTINGS STYLE */
        #settings-page { padding: 50px; background: #111; }
        .set-item { margin-bottom: 20px; font-size: 1.5rem; display: flex; align-items: center; gap: 20px; }
        .toggle { width: 60px; height: 30px; background: #444; border-radius: 15px; position: relative; cursor: pointer; }
        .toggle.on { background: #00fbff; }
        .toggle::after { content: ''; position: absolute; width: 26px; height: 26px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        .toggle.on::after { left: 32px; }

        /* TV MODE */
        video { width: 100%; height: 100%; object-fit: cover; }
        #no-signal { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; display: none; z-index: 10;
        }
        #info-tv {
            position: absolute; bottom: 30px; left: 30px; width: 400px;
            background: rgba(0,0,0,0.8); padding: 20px; border-left: 8px solid #00fbff;
        }
        .buf-bar { width: 100%; height: 10px; background: #222; margin-top: 10px; border-radius: 5px; overflow: hidden; }
        #buf-fill { width: 0%; height: 100%; background: #00fbff; }

        /* CH LIST (KIRI) */
        #ch-sidebar {
            position: absolute; left: 0; top: 0; width: 250px; height: 100%;
            background: rgba(0,0,0,0.9); border-right: 2px solid #00fbff;
            display: none; flex-direction: column; z-index: 600;
        }
        .ch-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
        .ch-item:hover { background: #00fbff; color: #000; }

        /* OTHERS */
        #browser-frame { width: 100%; height: 100%; border: none; background: white; }
        .full-center { display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="logo-box">AAA3 SET A BOX</div>
        <div class="icon-container">
            <div class="app-icon" onclick="openMode('dvd')"><i>💿</i><span class="app-name">DVD</span></div>
            <div class="app-icon" onclick="openMode('tv')"><i>📺</i><span class="app-name">TV</span></div>
            <div class="app-icon" onclick="openMode('settings')"><i>⚙️</i><span class="app-name">Settings</span></div>
            <div class="app-icon" onclick="openMode('usb')"><i>🔌</i><span class="app-name">USB</span></div>
            <div class="app-icon" onclick="openMode('browser')"><i>🌐</i><span class="app-name">Browsers</span></div>
        </div>
    </div>

    <div id="tv-mode" class="mode-layer">
        <div id="no-signal">
            <div style="font-size: 5rem;">🚫</div>
            <h1>No Signal</h1>
        </div>
        <div id="ch-sidebar"></div>
        <video id="v" autoplay></video>
        <div id="info-tv">
            <h2 id="ch-display">METRO TV</h2>
            <div class="buf-bar"><div id="buf-fill"></div></div>
            <p id="buf-txt" style="font-size: 0.8rem; margin-top:5px;">Buffer 0%</p>
        </div>
        <div id="num-overlay" style="position:absolute; top:30px; right:50px; font-size:80px; font-weight:bold; color:#00fbff;"></div>
    </div>

    <div id="settings-mode" class="mode-layer">
        <div id="settings-page">
            <h1 style="margin-bottom: 40px; color: #00fbff;">SETTINGS</h1>
            <div class="set-item">Status: <div id="toggle-off" class="toggle" onclick="this.classList.toggle('on')"></div> OFF</div>
            <div class="set-item">Volume: <button onclick="vol(-1)">-</button> <span id="vol-val">50</span> <button onclick="vol(1)">+</button></div>
            <div class="set-item">Skip Booting: [V] [X]</div>
            <div class="set-item">Timer: 1 2 3 4 5 10 20 60</div>
            <div class="set-item">Mode: AVS1 (Ready) | AVS2 (Ready) | USB (Not Ready)</div>
        </div>
    </div>

    <div id="usb-mode" class="mode-layer full-center">
        <div style="text-align:center;">
            <h1>USB FILE</h1>
            <p>Status: Belum Masuk</p>
            <div style="font-size: 100px; margin-top: 20px;">❗</div>
            <p>Not File</p>
        </div>
    </div>

    <div id="browser-mode" class="mode-layer">
        <iframe id="browser-frame" src="https://www.google.com/search?q=google&igu=1"></iframe>
    </div>

    <div id="dvd-mode" class="mode-layer full-center">
        <h1>DVD Not Support</h1>
    </div>

    <script>
        const v = document.getElementById('v');
        const hls = new Hls();
        let ch = []; let cur = 0; let input = "";

        // Navigasi Mode
        function openMode(mode) {
            document.querySelectorAll('.mode-layer').forEach(m => m.style.display = 'none');
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById(mode + '-mode').style.display = (mode === 'usb' || mode === 'dvd') ? 'flex' : 'block';
            if(mode === 'tv') loadTV();
        }

        function loadTV() {
            fetch("https://iptv-org.github.io/iptv/languages/ind.m3u").then(r => r.text()).then(d => {
                const lines = d.split('\n'); ch = [];
                const sidebar = document.getElementById('ch-sidebar');
                sidebar.innerHTML = "";
                let count = 0;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        let name = lines[i].split(',')[1].trim();
                        let url = lines[i+1].trim();
                        ch.push({ name, url });
                        let div = document.createElement('div');
                        div.className = "ch-item";
                        div.innerHTML = `<b>${count+1}</b> ${name}`;
                        let idx = count;
                        div.onclick = () => playTV(idx);
                        sidebar.appendChild(div);
                        count++;
                    }
                }
                playTV(0);
            });
        }

        function playTV(i) {
            if(!ch[i]) return;
            cur = i;
            document.getElementById('no-signal').style.display = 'none';
            document.getElementById('ch-display').innerText = ch[i].name;
            document.getElementById('ch-sidebar').style.display = 'none';
            
            hls.loadSource(ch[i].url);
            hls.attachMedia(v);
            hls.on(Hls.Events.MANIFEST_PARSED, () => v.play());

            // Real Buffer
            v.onprogress = () => {
                if (v.buffered.length > 0) {
                    let b = Math.round((v.buffered.end(0) - v.currentTime) * 20);
                    if(b > 100) b = 100;
                    document.getElementById('buf-fill').style.width = b + "%";
                    document.getElementById('buf-txt').innerText = "Buffer " + b + "%";
                }
            };
        }

        // Kontrol Keyboard/Remote
        window.addEventListener('keydown', (e) => {
            // EXIT KE HOME (7811) - Sesuai rancanganmu
            if(/[0-9]/.test(e.key)) {
                input += e.key;
                document.getElementById('num-overlay').innerText = input;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if(input === "7811") {
                        document.querySelectorAll('.mode-layer').forEach(m => m.style.display = 'none');
                        document.getElementById('home-screen').style.display = 'flex';
                    } else if(input === "1111") {
                        const s = document.getElementById('ch-sidebar');
                        s.style.display = (s.style.display === 'flex') ? 'none' : 'flex';
                    } else if(input === "1062") {
                        loadTV(); // Scan Ch
                    } else if(input === "0000") {
                        // Ganti AVS (Logic bisa ditambah)
                        alert("Ganti AVS 1/2");
                    } else {
                        let target = parseInt(input) - 1;
                        if(ch[target]) playTV(target);
                    }
                    input = ""; document.getElementById('num-overlay').innerText = "";
                }, 1000);
            }

            if(e.key === "ArrowUp") playTV(cur - 1);
            if(e.key === "ArrowDown") playTV(cur + 1);
        });

        function vol(dir) {
            let val = document.getElementById('vol-val');
            let n = parseInt(val.innerText) + (dir * 5);
            if(n >= 0 && n <= 100) val.innerText = n;
        }
    </script>
</body>
</html>
