<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AAA3 SET A BOX - V44</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        body { width: 100vw; height: 100vh; }
        
        /* BOOTING SCREEN - Z-Index Paling Tinggi */
        #boot {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 1s ease;
        }
        .logo { font-size: 3.5rem; color: #00fbff; font-weight: 900; letter-spacing: 12px; text-shadow: 0 0 30px #00fbff; }
        .spin { width: 40px; height: 40px; border: 4px solid #111; border-top: 4px solid #00fbff; border-radius: 50%; animation: s 1s linear infinite; margin-top: 20px; }
        @keyframes s { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        video { width: 100vw; height: 100vh; object-fit: contain; }
        
        #alert-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 60px; background: rgba(255, 0, 0, 0.9); color: white;
            border: 5px solid white; border-radius: 20px; font-size: 2.5rem; 
            font-weight: bold; display: none; z-index: 200; text-align: center;
        }

        #info-box { 
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); 
            width: 80%; max-width: 600px; padding: 25px; background: rgba(0, 5, 15, 0.95);
            border-bottom: 6px solid #00fbff; border-radius: 15px; display: none; z-index: 90;
        }
        #num-pop { position: absolute; top: 30px; right: 50px; font-size: 100px; font-weight: 900; color: #00fbff; z-index: 100; }
    </style>
</head>
<body onclick="v.play()">

    <div id="boot">
        <div class="logo">AAA3 SET A BOX</div>
        <div class="spin"></div>
        <p style="color: #00fbff; margin-top: 15px; font-size: 0.8rem; letter-spacing: 2px;">STARTING SYSTEM...</p>
    </div>

    <div id="num-pop"></div>
    <div id="alert-center">⚠️ SINYAL TERACAK</div>
    
    <div id="info-box">
        <div id="ch-name" style="color:white; font-size:1.8rem; font-weight:900;">MENCARI SINYAL...</div>
        <div style="width:100%; height:8px; background:#111; margin-top:10px; border-radius:4px; overflow:hidden;">
            <div id="bar-fill" style="width:0%; height:100%; background:#00fbff;"></div>
        </div>
        <p id="stat" style="color:#00fbff; font-size:0.9rem; margin-top:10px; font-weight:bold;">CONNECTING...</p>
    </div>

    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const hls = new Hls();
        let ch = []; let cur = 0; let b = ""; let mode = "AVS1";

        // Fungsi Hilangkan Booting
        function hideBoot() {
            const boot = document.getElementById('boot');
            boot.style.opacity = '0';
            setTimeout(() => { boot.style.display = 'none'; }, 1000);
        }

        // Emergency Exit (Jika internet mati total, logo tetep ilang biar bisa ganti AVS)
        setTimeout(() => { if(ch.length === 0) hideBoot(); }, 12000);

        function loadCh() {
            const url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); ch = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) ch.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                }
                if (ch.length > 0) {
                    hideBoot();
                    playCh(0);
                }
            }).catch(() => hideBoot());
        }

        function playCh(i) {
            if (i < 0) i = ch.length - 1;
            if (i >= ch.length) i = 0;
            cur = i;
            
            document.getElementById('alert-center').style.display = 'none';
            document.getElementById('ch-name').innerText = (i + 1) + ". " + ch[i].name;
            document.getElementById('info-box').style.display = 'block';

            if (hls) hls.destroy();
            const h = new Hls({ maxBufferLength: 5, enableWorker: false });
            h.loadSource(ch[i].url);
            h.attachMedia(v);
            h.on(Hls.Events.MANIFEST_PARSED, () => v.play());
            h.on(Hls.Events.ERROR, () => { document.getElementById('alert-center').style.display = 'block'; });

            v.onprogress = () => {
                if (v.buffered.length > 0) {
                    let p = Math.round((v.buffered.end(0) - v.currentTime) * 20);
                    if (p > 100) p = 100;
                    document.getElementById('bar-fill').style.width = p + "%";
                    document.getElementById('stat').innerText = "SIGNAL: " + p + "%";
                    if (p > 10) setTimeout(() => { document.getElementById('info-box').style.display = 'none'; }, 3000);
                }
            };
        }

        // REMOTE NAV V6 ENGINE
        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (c == 33 || c == 427 || e.key == "ArrowUp") playCh(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") playCh(cur - 1);

            if (/[0-9]/.test(e.key)) {
                b += e.key;
                document.getElementById('num-pop').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "0000") {
                        mode = (mode === "AVS1") ? "AVS2" : "AVS1";
                        loadCh();
                    } else if (b === "1062") {
                        loadCh();
                    } else {
                        let target = parseInt(b) - 1;
                        if (ch[target]) playCh(target);
                    }
                    b = ""; document.getElementById('num-pop').innerText = "";
                }, 1000);
            }
        });

        // Jalankan sistem
        loadCh();
    </script>
</body>
</html>
