<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII-TV STUDIO 2 (TV)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * { margin:0; padding:0; overflow:hidden; background:#000; }
        body { font-family: 'Courier New', monospace; color:#00fbff; cursor: none; }
        /* Efek Tabung Analog */
        body::before { content:" "; display:block; position:absolute; inset:0; background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%); z-index:20; background-size:100% 4px; pointer-events:none; }
        #noise { position:absolute; inset:0; background:url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Static_noise.gif'); opacity:0; z-index:5; pointer-events:none; mix-blend-mode:overlay; }
        .analog-v { filter: grayscale(0.4) contrast(1.2); animation: flicker 0.1s infinite; }
        @keyframes flicker { 0% { opacity: 0.98; } 100% { opacity: 1; } }
        
        video { width:100vw; height:100vh; object-fit:contain; }
        #ews { position:absolute; top:0; left:0; width:100%; background:red; color:white; padding:10px; z-index:1000; display:none; font-weight:bold; border-bottom:3px solid white; }
        #num { position:absolute; top:30px; right:50px; font-size:100px; font-weight:bold; z-index:99; text-shadow: 4px 4px #000; }
        #info { position:absolute; bottom:60px; left:60px; padding:20px; border:4px solid #00fbff; background:rgba(0,30,30,0.9); z-index:99; width:500px; display:none; }
        #alert-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3.5rem; color:red; border:6px solid red; padding:25px; display:none; z-index:100; background:#000; font-weight:bold; }
        .marquee { display: block; width: 100%; white-space: nowrap; overflow: hidden; }
        .marquee span { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
    </style>
</head>
<body onclick="v.play(); document.documentElement.requestFullscreen();">
    <div id="noise"></div>
    <div id="ews" class="marquee"><span id="ews-text">MENDETEKSI SINYAL BMKG...</span></div>
    <div id="num"></div>
    <div id="alert-center">⚠️ SINYAL TERACAK</div>
    
    <div id="info">
        <h2 id="n" style="font-size:2.2rem;"></h2>
        <p id="m-txt" style="color:yellow; letter-spacing:2px; font-weight:bold;"></p>
        <div style="border:2px solid #00fbff; height:8px; margin:10px 0;"><div id="bar" style="width:0%; height:100%; background:#00fbff;"></div></div>
        <p id="btxt" style="font-size:14px;">SIGNAL TUNING: 10s</p>
    </div>

    <video id="v" autoplay playsinline></video>
    <video id="tv" style="display:none;" muted></video>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBoS3INezO0UQptcXYNZFbnPbmmf_hU8xc",
          authDomain: "xbook-global26.firebaseapp.com",
          databaseURL: "https://xbook-global26-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "xbook-global26"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const v = document.getElementById('v');
        const h = new Hls();
        let ch = [], cur = 0, analogKill = false;

        // 1. LISTEN COMMAND DARI HP
        db.ref('tv_control/command').on('value', (s) => {
            const cmd = s.val();
            if(!cmd) return;
            execRemote(cmd.code);
        });

        function execRemote(code) {
            document.getElementById('num').innerText = code;
            setTimeout(() => document.getElementById('num').innerText = "", 2500);

            if(code === 'UP') play(cur+1);
            else if(code === 'DOWN') play(cur-1);
            else if(code === '999') { analogKill = !analogKill; play(cur); }
            else if(code === '82') { localStorage.clear(); db.ref('tv_control').remove(); location.reload(); }
            else { let n = parseInt(code)-1; if(ch[n]) play(n); }
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i;
            const isA = (Math.random() > 0.7) && !analogKill;
            
            document.getElementById('n').innerText = (i+1) + ". " + ch[i].name;
            document.getElementById('m-txt').innerText = isA ? "MODE: ANALOG" : "MODE: DIGITAL";
            document.getElementById('info').style.display = 'block';
            document.getElementById('noise').style.opacity = isA ? "0.3" : "0";
            v.className = isA ? "analog-v" : "";
            
            document.getElementById('alert-center').style.display = 'none';
            h.loadSource(ch[i].url); h.attachMedia(v);
            
            // Kirim balik status ke HP
            db.ref('tv_control/current').set({ name: ch[i].name, id: i+1 });

            v.onplaying = () => {
                document.getElementById('bar').style.width = "100%";
                document.getElementById('btxt').innerText = "SIGNAL: LOCKED OK";
                setTimeout(() => document.getElementById('info').style.display = 'none', 3000);
            };
        }

        async function checkBMKG() {
            try {
                const geo = await fetch('https://ipapi.co/json/').then(r => r.json());
                const gempa = await fetch('https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json').then(r => r.json());
                const d = gempa.Infogempa.gempa;
                document.getElementById('ews').style.display = "block";
                document.getElementById('ews-text').innerText = `[EWS BMKG] LOKASI: ${geo.city.toUpperCase()} | GEMPA MAG: ${d.Magnitude} | WILAYAH: ${d.Wilayah} | POTENSI: ${d.Potensi}`;
            } catch (e) {}
        }

        function load() {
            fetch("https://iptv-org.github.io/iptv/languages/ind.m3u").then(r => r.text()).then(d => {
                const lines = d.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) ch.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                }
                play(0); checkBMKG();
            });
        }
        load();
    </script>
</body>
</html>
