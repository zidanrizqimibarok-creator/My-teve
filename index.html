<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V38 - SCAN 1062</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        
        #num { position: absolute; top: 30px; right: 50px; font-size: 100px; font-weight: 900; color: #00fbff; z-index: 99; }
        
        /* ALERT TERACAK TENGAH */
        #alert-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px; background: rgba(255, 0, 0, 0.9); color: white;
            border: 4px solid white; border-radius: 15px; font-size: 2rem; font-weight: bold;
            z-index: 200; display: none; text-align: center;
        }

        /* OVERLAY SCANNING 1062 */
        #scan-box {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,10,0.95); z-index: 300; display: none;
            flex-direction: column; align-items: center; justify-content: center; color: #00fbff;
        }
        .bar-scan { width: 60%; height: 10px; background: #111; border: 1px solid #00fbff; margin-top: 20px; overflow: hidden; }
        #fill-scan { width: 0%; height: 100%; background: #00fbff; }

        #info-box { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); 
            width: 85%; max-width: 600px; padding: 20px; background: rgba(0, 5, 10, 0.9);
            border-bottom: 5px solid #00fbff; border-radius: 10px; display: none; z-index: 98;
        }
    </style>
</head>
<body onclick="v.play()">

    <div id="num"></div>
    <div id="alert-center">⚠️ SINYAL TERACAK</div>

    <div id="scan-box">
        <h1 id="scan-status">DEEP SCANNING V38...</h1>
        <div class="bar-scan"><div id="fill-scan"></div></div>
        <p id="scan-info" style="margin-top:10px;">Memverifikasi satelit...</p>
    </div>
    
    <div id="info-box">
        <h2 id="ch-name" style="color:white">MENCARI SINYAL...</h2>
        <p id="stat" style="color:#00fbff; font-size:0.9rem; margin-top:10px;">SIGNAL: 0%</p>
    </div>
    
    <div id="menu" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:400px; height:60vh; background:#050505; border:2px solid #00fbff; display:none; flex-direction:column; z-index:400;">
        <div style="padding:15px; background:#00fbff; color:#00; font-weight:bold; text-align:center;">DAFTAR CH (1111)</div>
        <div id="mlist" style="overflow-y:auto; flex:1;"></div>
    </div>

    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const alertBox = document.getElementById('alert-center');
        const scanBox = document.getElementById('scan-box');
        const fillScan = document.getElementById('fill-scan');
        const mlist = document.getElementById('mlist');
        
        let ch = []; let cur = 0; let b = ""; let h = null; let mode = "AVS1";

        function load(url) {
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); ch = []; mlist.innerHTML = "";
                let count = 0;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        ch.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                        let item = document.createElement('div');
                        item.className = "m-item";
                        item.style = "padding:15px; border-bottom:1px solid #111; color:#ccc; cursor:pointer;";
                        item.innerHTML = `<b>${count+1}</b> ${ch[count].name}`;
                        let idx = count;
                        item.onclick = () => { play(idx); document.getElementById('menu').style.display = 'none'; };
                        mlist.appendChild(item);
                        count++;
                    }
                }
                if (ch.length > 0) play(0);
            });
        }

        async function startScan1062() {
            scanBox.style.display = 'flex';
            let valid = [];
            for (let i = 0; i < ch.length; i++) {
                let p = Math.round((i / ch.length) * 100);
                fillScan.style.width = p + "%";
                document.getElementById('scan-info').innerText = `Checking: ${ch[i].name}`;
                
                try {
                    const res = await fetch(ch[i].url, { method: 'HEAD', mode: 'no-cors' });
                    valid.push(ch[i]); // Simpan yang responnya oke
                } catch (e) { /* Abaikan yang mati */ }
                
                if (i % 5 === 0) await new Promise(r => setTimeout(r, 50));
            }
            ch = valid;
            scanBox.style.display = 'none';
            play(0);
        }

        function play(i) {
            if (i < 0) i = ch.length - 1;
            if (i >= ch.length) i = 0;
            cur = i;
            
            alertBox.style.display = 'none';
            document.getElementById('ch-name').innerText = (i + 1) + ". " + ch[i].name;
            document.getElementById('info-box').style.display = 'block';

            if (h) h.destroy();
            h = new Hls({ maxBufferLength: 5, enableWorker: false });
            h.loadSource(ch[i].url);
            h.attachMedia(v);
            
            h.on(Hls.Events.ERROR, (e, data) => { if(data.fatal) alertBox.style.display = 'block'; });
            v.onplaying = () => { 
                alertBox.style.display = 'none';
                setTimeout(() => { document.getElementById('info-box').style.display = 'none'; }, 3000);
            };
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowUp") play(cur - 1);
            if (e.key === "ArrowDown") play(cur + 1);
            if (/[0-9]/.test(e.key)) {
                b += e.key;
                document.getElementById('num').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "1111") {
                        const m = document.getElementById('menu');
                        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
                    } else if (b === "1062") {
                        startScan1062();
                    } else if (b === "0000") {
                        mode = (mode === "AVS1") ? "AVS2" : "AVS1";
                        load(mode === "AVS2" ? "https://iptv-org.github.io/iptv/categories/kids.m3u" : "https://iptv-org.github.io/iptv/languages/ind.m3u");
                    } else {
                        let target = parseInt(b) - 1;
                        if (ch[target]) play(target);
                    }
                    b = ""; document.getElementById('num').innerText = "";
                }, 800);
            }
        });

        load("https://iptv-org.github.io/iptv/languages/ind.m3u");
    </script>
</body>
</html>
