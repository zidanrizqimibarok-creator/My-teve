<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AAA3 SET A BOX - V46</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: sans-serif; color: #00fbff; width: 100vw; height: 100vh; }
        video { width: 100vw; height: 100vh; object-fit: contain; cursor: none; }
        
        /* ASLI V11 */
        #num { position: absolute; top: 10px; left: 10px; font-size: 80px; font-weight: bold; z-index: 99; }
        
        /* UPDATE STYLE KOTAK CH (AAA3 Style) */
        #info { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px; padding: 20px; 
            background: rgba(0, 10, 20, 0.9); border-bottom: 5px solid #00fbff;
            border-radius: 10px; display: none; z-index: 99;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #n { color: #fff; font-size: 1.8rem; font-weight: bold; margin-bottom: 5px; }

        /* BOOTING AAA3 */
        #boot {
            position: fixed; top:0; left:0; width:100%; height:100%; background:#000;
            display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;
        }

        /* SINYAL TERACAK TENGAH */
        #alert-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 50px; background: rgba(220, 0, 0, 0.9); color: white;
            border: 4px solid white; border-radius: 15px; font-size: 2.2rem; font-weight: bold;
            display: none; z-index: 100; text-align: center; box-shadow: 0 0 50px red;
        }

        /* SHORTCUT 7091 BOX */
        #shortcut-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 70%; background: rgba(0, 5, 10, 0.95);
            border: 2px solid #00fbff; display: none; z-index: 500;
            padding: 20px; border-radius: 15px; grid-template-columns: repeat(4, 1fr);
            gap: 10px; overflow-y: auto;
        }
        .sc-item { 
            padding: 15px; background: #111; color: #00fbff; border: 1px solid #333;
            text-align: center; cursor: pointer; border-radius: 5px; font-weight: bold;
        }
        .sc-item:hover { background: #00fbff; color: #000; }
        .sc-dead { color: #ff3b3b; border-color: #ff3b3b; } /* Merah jika teracak */

        #bar-bg { width: 100%; height: 6px; background: #1a1a1a; margin-top: 10px; border-radius: 3px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #00fbff; transition: 0.3s; }
    </style>
</head>
<body onclick="startAll()">

    <div id="boot">
        <h1 style="letter-spacing:10px;">AAA3 SET A BOX</h1>
        <p style="margin-top:20px; font-size:12px; opacity:0.5;">LOADING SYSTEM...</p>
    </div>

    <div id="num"></div>
    <div id="alert-center">⚠️ SINYAL TERACAK</div>

    <div id="shortcut-box"></div>

    <div id="info">
        <h2 id="n"></h2>
        <p style="font-size: 0.8rem; letter-spacing: 2px;">AAA3 DIGITAL RECEIVER</p>
        <div id="bar-bg"><div id="bar-fill"></div></div>
        <p id="buf-txt" style="font-size:11px; margin-top:5px; font-weight: bold;">SIGNAL: 0%</p>
    </div>

    <video id="v" playsinline autoplay></video>

    <script>
        const v = document.getElementById('v');
        const num = document.getElementById('num');
        const info = document.getElementById('info');
        const n = document.getElementById('n');
        const alertBox = document.getElementById('alert-center');
        const bar = document.getElementById('bar-fill');
        const scBox = document.getElementById('shortcut-box');
        
        let ch = []; let cur = 0; let b = ""; let h = new Hls(); let mode = "AVS1";

        // FULLSCREEN & BOOTING START
        function startAll() {
            if (v.requestFullscreen) v.requestFullscreen();
            else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
            v.play();
        }

        setTimeout(() => { document.getElementById('boot').style.display = 'none'; }, 5000);

        function load() {
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                ch = []; const lines = d.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        ch.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim(), dead: false });
                    }
                }
                if(ch.length > 0) play(0);
            });
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i;
            alertBox.style.display = 'none';
            scBox.style.display = 'none'; // Kotak hilang jika sudah milih
            n.innerText = (i + 1) + ". " + ch[i].name;
            info.style.display = 'block';
            
            if (h) h.destroy();
            h = new Hls({ maxBufferLength: 5, enableWorker: false });
            h.loadSource(ch[i].url);
            h.attachMedia(v);
            
            h.on(Hls.Events.ERROR, (e, data) => {
                if(data.fatal) {
                    alertBox.style.display = 'block';
                    ch[cur].dead = true; // Tandai merah di shortcut
                }
            });

            v.onprogress = () => {
                if (v.buffered.length > 0) {
                    let p = Math.round((v.buffered.end(0) - v.currentTime) * 20);
                    if (p > 100) p = 100;
                    bar.style.width = p + "%";
                    document.getElementById('buf-txt').innerText = "SIGNAL: " + p + "%";
                    if (p > 15) setTimeout(() => { info.style.display = 'none'; }, 3000);
                }
            };
        }

        function showShortcut() {
            scBox.innerHTML = "";
            scBox.style.display = 'grid';
            ch.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = "sc-item " + (item.dead ? "sc-dead" : "");
                div.innerHTML = `CH ${index+1}<br><span style="font-size:10px">${item.name}</span>`;
                div.onclick = () => play(index);
                scBox.appendChild(div);
            });
        }

        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") play(cur - 1);
            if (e.key == "Enter") { if(scBox.style.display == 'grid') scBox.style.display = 'none'; else showShortcut(); }

            if (/[0-9]/.test(e.key)) {
                b += e.key; num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "7091") showShortcut();
                    else if (b === "0000") { mode = (mode === "AVS2" ? "AVS1" : "AVS2"); load(); }
                    else if (b === "1062") load();
                    else { let t = parseInt(b)-1; if(ch[t]) play(t); }
                    b = ""; num.innerText = "";
                }, 800);
            }
        });

        load();
    </script>
</body>
</html>
