<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V11 - AAA3 V60 TURBO HYBRID</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        /* STYLE TV TABUNG JADUL 2012 */
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: 'Courier New', Courier, monospace; color: #00fbff; text-shadow: 2px 2px #000; }
        
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 10; background-size: 100% 4px; pointer-events: none;
        }

        #noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Static_noise.gif');
            opacity: 0; z-index: 5; pointer-events: none; mix-blend-mode: overlay;
        }

        .analog-filter { filter: grayscale(0.4) contrast(1.2) brightness(1.1); animation: flicker 0.1s infinite; }
        @keyframes flicker { 0% { opacity: 0.97; } 50% { opacity: 1; } 100% { opacity: 0.98; } }

        video { width: 100vw; height: 100vh; object-fit: contain; }
        #num { position: absolute; top: 30px; right: 50px; font-size: 80px; font-weight: bold; z-index: 99; color: #00fbff; }

        #info { 
            position: absolute; bottom: 60px; left: 60px; padding: 20px; border: 4px solid #00fbff;
            background: rgba(0, 40, 40, 0.9); z-index: 99; width: 450px; display: none;
        }

        #alert-center { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: #ff0000; font-weight: bold; border: 4px solid #ff0000; 
            padding: 20px; display: none; z-index: 100; background: #000;
        }

        #scan-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; padding: 30px; background: #002222; border: 4px solid #00fbff;
            display: none; z-index: 1000; text-align: center;
        }

        #shortcut {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 75%; background: rgba(0, 10, 10, 0.98); border: 2px solid #00fbff;
            display: none; z-index: 500; padding: 20px; overflow-y: auto;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
        }
        .sc-item { padding: 10px; border: 1px solid #004444; color: #008888; font-size: 14px; }
        .sc-item.focus { background: #00fbff; color: #000; font-weight: bold; }
        #usb-input { display: none; }
    </style>
</head>
<body onclick="document.documentElement.requestFullscreen(); v.play();">

    <div id="noise"></div>
    <div id="num"></div>
    <div id="alert-center">⚠️ SINYAL TERACAK</div>
    <input type="file" id="usb-input" accept=".m3u,.mp4">

    <div id="scan-ui">
        <h2 style="letter-spacing:5px;">TURBO SCANNING 2x</h2>
        <div id="scan-perc" style="font-size: 50px; margin: 15px 0; color:#00fbff;">0%</div>
        <div style="margin-bottom:10px;">AKTIF: <span id="sc-good" style="color:#00fbff;">0</span></div>
        <p id="sc-name" style="font-size:12px; color:#666; text-transform:uppercase;">INITIALIZING TUNER...</p>
    </div>

    <div id="shortcut"></div>

    <div id="info">
        <h2 id="n" style="font-size: 2rem;"></h2>
        <p id="mode-text" style="color: yellow; letter-spacing: 2px; font-weight:bold;"></p>
        <div style="border: 2px solid #00fbff; height: 10px; margin: 10px 0;">
            <div id="bar-fill" style="width:0%; height:100%; background:#00fbff;"></div>
        </div>
        <p id="btxt" style="font-size: 14px;">TUNING: 10s</p>
    </div>

    <video id="v" playsinline autoplay></video>
    <video id="test-v" style="display:none;" muted></video>

    <script>
        const v = document.getElementById('v');
        const tv = document.getElementById('test-v');
        const noise = document.getElementById('noise');
        const h = new Hls(); const th = new Hls();
        const info = document.getElementById('info');
        const btxt = document.getElementById('btxt');
        const usbIn = document.getElementById('usb-input');
        const num = document.getElementById('num');
        const scBox = document.getElementById('shortcut');
        const alertBox = document.getElementById('alert-center');
        const bar = document.getElementById('bar-fill');
        
        let ch = [], fullCh = [], cur = 0, scIdx = 0, b = "", mode = "AVS1", timerCD, count = 10, isSc = false;

        function load() {
            const saved = localStorage.getItem('aaa3_channels');
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); let temp = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        let type = Math.random() > 0.7 ? 'A' : 'D'; 
                        temp.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim(), type: type });
                    }
                }
                fullCh = [...temp];
                ch = (saved && mode === "AVS1") ? JSON.parse(saved) : [...temp];
                play(0);
            });
        }

        // DOUBLE SCAN TURBO (2x Cek per Channel)
        async function turboScan() {
            document.getElementById('scan-ui').style.display = 'block';
            let good = 0, checked = [];
            for(let i=0; i < ch.length; i++) {
                document.getElementById('scan-perc').innerText = Math.round((i/ch.length)*100) + "%";
                document.getElementById('sc-name').innerText = "LOCKING: " + ch[i].name;
                
                // Cek Pertama
                let res1 = await check(ch[i].url, 2500);
                if(!res1) {
                    // Cek Kedua (Double Check) jika pertama gagal
                    document.getElementById('sc-name').innerText = "RE-LOCKING: " + ch[i].name;
                    res1 = await check(ch[i].url, 3500);
                }

                if(res1) { good++; checked.push(ch[i]); }
                document.getElementById('sc-good').innerText = good;
            }
            ch = checked; localStorage.setItem('aaa3_channels', JSON.stringify(ch));
            document.getElementById('scan-ui').style.display = 'none'; play(0);
        }

        function check(url, time) {
            return new Promise((r) => {
                th.loadSource(url); th.attachMedia(tv);
                let t = setTimeout(() => { th.stopLoad(); r(false); }, time);
                th.once(Hls.Events.FRAG_BUFFERED, () => { clearTimeout(t); r(true); });
                th.once(Hls.Events.ERROR, () => { clearTimeout(t); r(false); });
            });
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i; alertBox.style.display = 'none'; 
            const isA = ch[i].type === 'A';
            
            document.getElementById('n').innerText = (i + 1) + ". " + ch[i].name;
            document.getElementById('mode-text').innerText = isA ? "MODE: ANALOG" : "MODE: DIGITAL";
            info.style.display = 'block';
            noise.style.opacity = isA ? "0.3" : "0";
            v.className = isA ? "analog-filter" : "";

            clearInterval(timerCD);
            count = 10; bar.style.width = "0%";
            btxt.innerText = "TUNING: " + count + "s";
            h.loadSource(ch[i].url); h.attachMedia(v);

            timerCD = setInterval(() => {
                count--;
                if(count >= 0) btxt.innerText = "TUNING: " + count + "s";
                else {
                    clearInterval(timerCD);
                    if(v.paused || v.readyState < 3) alertBox.style.display = 'block';
                    setTimeout(() => { info.style.display = 'none'; }, 2000);
                }
            }, 1000);

            v.onplaying = () => { alertBox.style.display = 'none'; bar.style.width = "100%"; btxt.innerText = "SIGNAL: OK"; };
        }

        // SEMUA SHORTCUT KEMBALI
        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (isSc) {
                if (c == 33 || c == 427 || e.key == "ArrowUp") { scIdx = (scIdx > 0) ? scIdx - 1 : ch.length - 1; openSc(); }
                if (c == 34 || c == 428 || e.key == "ArrowDown") { scIdx = (scIdx < ch.length - 1) ? scIdx + 1 : 0; openSc(); }
                if (e.key == "0") { play(scIdx); isSc = false; scBox.style.display = 'none'; }
                return;
            }
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") {
                if (b === "82") { localStorage.removeItem('aaa3_channels'); ch = [...fullCh]; play(0); b = ""; num.innerText = ""; }
                else play(cur - 1);
            }
            if (/[0-9]/.test(e.key)) {
                b += e.key; num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "7091") { scIdx = cur; isSc = true; openSc(); }
                    else if (b === "1062") turboScan();
                    else if (b === "2701") usbIn.click();
                    else if (b === "0000") { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
                    else if (b !== "82") { let t = parseInt(b)-1; if(ch[t]) play(t); }
                    if (b !== "82") { b = ""; num.innerText = ""; }
                }, 800);
            }
        });

        function openSc() {
            scBox.innerHTML = ""; scBox.style.display = 'grid';
            ch.forEach((it, i) => {
                let d = document.createElement('div');
                d.className = "sc-item" + (i === scIdx ? " focus" : "");
                d.innerHTML = `[${it.type}] ${i+1}. ${it.name}`;
                scBox.appendChild(d);
            });
            scBox.children[scIdx].scrollIntoView({ block: "center" });
        }

        usbIn.onchange = (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            ch = [{name: "USB MEDIA", url: url, type: 'D'}]; play(0);
        };

        load();
    </script>
</body>
</html>
