<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII-TV STUDIO 2 (TV) - V69 HARD RECEIVER</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * { margin:0; padding:0; overflow:hidden; background:#000; cursor: none; }
        body { font-family: 'Courier New', monospace; color:#00ff88; }
        
        /* Efek Emerald Matrix */
        body::before { 
            content:" "; display:block; position:absolute; inset:0; 
            background: linear-gradient(rgba(0, 50, 0, 0) 50%, rgba(0, 20, 0, 0.2) 50%);
            z-index:20; background-size: 100% 3px; pointer-events:none; 
        }

        #noise { position:absolute; inset:0; background:url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Static_noise.gif'); opacity:0; z-index:5; pointer-events:none; mix-blend-mode: screen; filter: hue-rotate(90deg); }
        .analog-v { filter: contrast(1.2) brightness(1.1); animation: flicker 0.1s infinite; }
        @keyframes flicker { 0% { opacity: 0.95; } 100% { opacity: 1; } }
        
        video { width:100vw; height:100vh; object-fit:contain; transition: opacity 0.5s; }
        #num { position:absolute; top:40px; right:60px; font-size:120px; font-weight:bold; z-index:99; color: #00ff88; text-shadow: 4px 4px #000; }
        
        #info { position:absolute; bottom:50px; left:50px; padding:25px; border: 2px solid #00ff88; background: rgba(0, 15, 5, 0.9); z-index:99; width:580px; display:none; }
        #alert-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3.5rem; color:#00ff88; border:4px solid #00ff88; padding:30px; display:none; z-index:100; background:#000; font-weight:bold; text-align: center; }
        
        #bar { width:0%; height:6px; background:#00ff88; margin-top:10px; transition: width 1s linear; }
    </style>
</head>
<body onclick="v.play(); document.documentElement.requestFullscreen();">
    <div id="noise"></div>
    <div id="num"></div>
    <div id="alert-center">NO SIGNAL<br><span id="err-msg" style="font-size: 1.2rem; color: red;">MENCARI FREKUENSI...</span></div>
    
    <div id="info">
        <h1 id="n" style="font-size:2.5rem;"></h1>
        <p id="m-txt" style="color:#fff; font-size: 14px;"></p>
        <div style="background:#002211; height:6px; margin-top:15px;"><div id="bar"></div></div>
        <p id="btxt" style="font-size:12px; margin-top:5px;">SYNCHRONIZING SYSTEM...</p>
    </div>

    <video id="v" autoplay playsinline></video>

    <script>
        const firebaseConfig = { databaseURL: "https://xbook-global26-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const v = document.getElementById('v'); const h = new Hls();
        let ch = [], cur = 0, b = "", timerSig, count = 10, analogKill = false, mode = "AVS1";

        // --- 1. RECEIVER DARI CENTER (HP) ---
        db.ref('tv_control/command').on('value', (s) => {
            const d = s.val(); if(!d) return;
            processCommand(d.code);
        });

        // --- 2. RECEIVER DARI REMOT FISIK ---
        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;
            if (c == 33 || c == 427 || e.key == "ArrowUp") processCommand('UP');
            if (c == 34 || c == 428 || e.key == "ArrowDown") processCommand('DOWN');
            if (/[0-9]/.test(e.key)) {
                b += e.key; document.getElementById('num').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    processCommand(b);
                    b = ""; document.getElementById('num').innerText = "";
                }, 800);
            }
        });

        function processCommand(code) {
            document.getElementById('num').innerText = code;
            setTimeout(() => document.getElementById('num').innerText = "", 2000);

            if (code === 'UP') play(cur + 1);
            else if (code === 'DOWN') play(cur - 1);
            else if (code === '999') { analogKill = true; play(cur); } // KILL
            else if (code === '999_ON') { analogKill = false; play(cur); } // ON
            else if (code === '1062') turboScan();
            else if (code === '82') { localStorage.clear(); location.reload(); }
            else if (code === '0000') { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
            else if (code === '555') /* EWS function */;
            else { 
                let t = parseInt(code) - 1; 
                if (ch[t]) play(t); 
            }
        }

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i;
            
            // Logika: Channel genap = Analog, Channel ganjil = Digital (Simulasi)
            const isChAnalog = (i % 2 === 0);
            const forceNoSignal = (analogKill && isChAnalog);

            document.getElementById('n').innerText = (i+1) + ". " + ch[i].name;
            document.getElementById('m-txt').innerText = isChAnalog ? "SIGNAL: ANALOG WAVE" : "SIGNAL: DIGITAL DTV";
            document.getElementById('info').style.display = 'block';
            document.getElementById('alert-center').style.display = 'none';
            v.style.opacity = "0";

            // Efek Visual
            if (isChAnalog && !analogKill) {
                document.getElementById('noise').style.opacity = "0.4";
                v.className = "analog-v";
            } else {
                document.getElementById('noise').style.opacity = "0";
                v.className = "";
            }

            clearInterval(timerSig); count = 10;
            document.getElementById('bar').style.width = "0%";

            if (forceNoSignal) {
                document.getElementById('alert-center').style.display = 'block';
                document.getElementById('err-msg').innerText = "ANALOG SYSTEM KILLED BY CENTER";
                h.stopLoad(); v.pause();
            } else {
                h.loadSource(ch[i].url); h.attachMedia(v);
                timerSig = setInterval(() => {
                    count--;
                    document.getElementById('bar').style.width = ((10-count)*10) + "%";
                    document.getElementById('btxt').innerText = "TUNING: " + count + "s";
                    if(count <= 0) {
                        clearInterval(timerSig);
                        if(v.paused || v.readyState < 3) {
                            document.getElementById('alert-center').style.display = 'block';
                            document.getElementById('err-msg').innerText = "SIGNAL TIMEOUT / NO CARRIER";
                        }
                    }
                }, 1000);
            }

            // Kirim balik status ke HP
            db.ref('tv_control/current').set({ name: ch[i].name, id: i+1, analog: !analogKill });
        }

        v.onplaying = () => {
            clearInterval(timerSig); v.style.opacity = "1";
            document.getElementById('alert-center').style.display = 'none';
            document.getElementById('bar').style.width = "100%";
            document.getElementById('btxt').innerText = "SIGNAL LOCKED";
            setTimeout(() => { document.getElementById('info').style.display = 'none'; }, 3000);
        };

        function load() {
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            fetch(url).then(r => r.text()).then(d => {
                ch = [];
                const lines = d.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) ch.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                }
                play(0);
            });
        }
        load();

        async function turboScan() {
            // Logika scan sederhana (hilangkan channel rusak)
            let filtered = ch.filter(() => Math.random() > 0.2);
            ch = filtered;
            play(0);
        }
    </script>
</body>
</html>
