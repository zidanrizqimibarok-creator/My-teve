<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEII TV V10</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        body { background: #000; font-family: sans-serif; color: white; cursor: none; }
        #tv-screen { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        /* Indikator Loading / Blank */
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.5rem; color: #00fbff; font-weight: bold; z-index: 20; display: none;
        }

        /* OSD & Nomor */
        #num-in { position: absolute; top: 20px; left: 20px; font-size: 7rem; color: #00fbff; font-weight: bold; z-index: 100; }
        #osd { 
            position: absolute; bottom: 5%; left: 5%; background: rgba(0,0,0,0.8);
            padding: 15px 40px; border-left: 10px solid #00fbff; opacity: 0; transition: 0.3s; z-index: 10;
        }
        #osd.active { opacity: 1; }
        
        /* Menu 0000 */
        #menu-tv {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 70%; background: #111; border: 3px solid #00fbff;
            display: none; flex-direction: column; z-index: 200;
        }
        #list { overflow-y: auto; flex: 1; padding: 10px; }
        .item { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .item.active { background: #00fbff; color: #000; font-weight: bold; }
    </style>
</head>
<body onclick="player.play()">

    <div id="tv-screen">
        <div id="loader">MENGHUBUNGKAN...</div>
        <div id="num-in"></div>
        <video id="player" playsinline autoplay></video>

        <div id="osd">
            <h1 id="ch-id">01</h1>
            <div id="ch-name" style="font-size: 2rem; font-weight: bold;">MEMUAT...</div>
        </div>

        <div id="menu-tv">
            <div style="padding:10px; background:#00fbff; color:#000; text-align:center;">DAFTAR SALURAN (0101 UNTUK KELUAR)</div>
            <div id="list"></div>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const osd = document.getElementById('osd');
        const loader = document.getElementById('loader');
        const numIn = document.getElementById('num-in');
        const menuTv = document.getElementById('menu-tv');
        
        let channels = [];
        let cur = 0;
        let buf = "";
        let hls = new Hls();

        // Ambil Data - Urutan 01 AKTV
        fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent("https://iptv-org.github.io/iptv/languages/ind.m3u"))
            .then(r => r.text())
            .then(data => {
                const lines = data.split('\n');
                let id = 1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        const name = lines[i].split(',')[1].trim();
                        const url = lines[i+1]?.trim();
                        if(url) {
                            channels.push({ id: id++, name, url });
                            const div = document.createElement('div');
                            div.className = 'item';
                            div.id = `ch-${channels.length-1}`;
                            div.innerHTML = `<span>${channels.length}. ${name}</span>`;
                            document.getElementById('list').appendChild(div);
                        }
                    }
                }
                play(0);
            });

        function play(idx) {
            if (idx < 0) idx = channels.length - 1;
            if (idx >= channels.length) idx = 0;
            cur = idx;
            const ch = channels[idx];

            // UI Instan
            loader.style.display = 'block';
            document.getElementById('ch-id').innerText = ch.id.toString().padStart(2, '0');
            document.getElementById('ch-name').innerText = ch.name;
            osd.classList.add('active');
            setTimeout(() => osd.classList.remove('active'), 3000);

            // Engine Play (Ultra Light)
            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls({ 
                    manifestLoadingTimeOut: 5000, 
                    fragLoadingTimeOut: 5000,
                    enableWorker: true 
                });
                hls.loadSource(ch.url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    player.play();
                    loader.style.display = 'none';
                });

                // AUTO-RECONNECT JIKA BLANK
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        console.log("Koneksi gagal, mencoba lagi...");
                        setTimeout(() => play(cur), 3000); 
                    }
                });
            }
        }

        // Navigasi Remote
        window.addEventListener('keydown', (e) => {
            const k = e.key;
            const c = e.keyCode;

            if (k === "ArrowUp" || c === 427 || c === 33) play(cur + 1);
            if (k === "ArrowDown" || c === 428 || c === 34) play(cur - 1);

            if (/[0-9]/.test(k)) {
                buf += k;
                numIn.innerText = buf;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (buf === "0000") menuTv.style.display = 'flex';
                    else if (buf === "0101") menuTv.style.display = 'none';
                    else {
                        const t = parseInt(buf) - 1;
                        if (channels[t]) play(t);
                    }
                    buf = ""; numIn.innerText = "";
                }, 1000);
            }
        });
    </script>
</body>
</html>
