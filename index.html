<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CONECTA TV - LOCAL HD</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <style>
        * { margin:0; padding:0; overflow:hidden; background:#000; cursor: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#00ff88; }
        
        /* Booting */
        #booting {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .boot-text { font-size: 3.5rem; font-weight: 900; color: #fff; letter-spacing: 8px; }

        /* Logo CONECTA */
        #logo-conecta {
            position: absolute; top: 30px; right: 40px; 
            font-size: 1.8rem; font-weight: 900; color: #ffcc00;
            text-shadow: 2px 2px 10px #000; z-index: 100;
            border-bottom: 3px solid #00ff88; padding-bottom: 5px;
        }

        /* SIDEBAR NOTIFIKASI (Kanan) */
        #sidebar {
            position: absolute; right: 20px; top: 100px; width: 220px;
            z-index: 105; display: flex; flex-direction: column; gap: 10px;
        }
        .notif-box {
            background: rgba(0, 20, 10, 0.85); border: 1px solid #00ff88;
            padding: 12px; border-left: 5px solid #ffcc00;
            animation: slideIn 0.5s ease-out; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .notif-title { font-size: 10px; font-weight: bold; color: #ffcc00; margin-bottom: 4px; text-transform: uppercase; }
        .notif-msg { font-size: 12px; color: #fff; line-height: 1.2; }

        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(50%); } }

        video { width:100vw; height:100vh; object-fit:contain; }
        
        /* Info Channel */
        #info { 
            position:absolute; bottom:50px; left:50px; padding:30px; 
            background: linear-gradient(90deg, rgba(0,40,20,0.9) 0%, rgba(0,0,0,0.8) 100%); 
            z-index:99; width:600px; display:none; border-left: 10px solid #00ff88;
        }

        #alert-center { 
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); 
            font-size:3rem; color:#ff0000; border:4px solid #ff0000; padding:30px; 
            display:none; z-index:100; background:#000; font-weight:bold; text-align:center;
        }

        #bar { width: 0%; height: 5px; background: #00ff88; margin-top: 10px; transition: width 1s linear; }
        #num-overlay { position: absolute; top: 40px; left: 40px; font-size: 100px; color: rgba(0,255,136,0.3); font-weight: bold; }
    </style>
</head>
<body onclick="startTV()">

    <div id="booting">
        <div class="boot-text">CONECTA</div>
        <div style="color:#00ff88; letter-spacing:3px;">LINK HD SYSTEM</div>
    </div>

    <div id="logo-conecta">CONECTA TV</div>
    <div id="sidebar"></div>
    <div id="num-overlay"></div>
    <div id="alert-center">SINYAL TERPUTUS<br><small style="font-size: 1rem; color:#fff;">CHECK CONECTA LINK</small></div>
    
    <div id="info">
        <h1 id="n" style="font-size:2.5rem; color:#fff;"></h1>
        <p id="m-txt" style="color:#00ff88; font-weight:bold; font-size:12px;"></p>
        <div style="font-size:12px; color:#ffcc00; margin-top:10px;">SIGNAL: <span id="sig-val">0</span>% [STABLE]</div>
        <div style="background:#111; height:5px; margin-top:5px;"><div id="bar"></div></div>
    </div>

    <video id="v" autoplay playsinline></video>

    <script>
        const v = document.getElementById('v'); const h = new Hls();
        let ch = [], cur = 0, b = "", analogKill = false;

        // 1. Booting System
        function startTV() {
            document.getElementById('booting').fadeOut = true;
            document.getElementById('booting').style.display = 'none';
            document.documentElement.requestFullscreen();
            load();
            startNotifSystem();
        }

        // 2. Input Remot (Keyboard Only - No Firebase)
        window.addEventListener('keydown', (e) => {
            if (e.keyCode == 33 || e.key == "ArrowUp") play(cur + 1);
            if (e.keyCode == 34 || e.key == "ArrowDown") play(cur - 1);
            if (/[0-9]/.test(e.key)) {
                b += e.key; document.getElementById('num-overlay').innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if(b === "999") { analogKill = !analogKill; showNotif("ANALOG SYSTEM", analogKill ? "Killed by User" : "Restored to Default"); play(cur); }
                    else if(b === "82") location.reload();
                    else { let t = parseInt(b) - 1; if(ch[t]) play(t); }
                    b = ""; document.getElementById('num-overlay').innerText = "";
                }, 800);
            }
        });

        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i;
            
            const isAnalog = (i % 2 === 0);
            const isLocked = (analogKill && isAnalog);

            document.getElementById('n').innerText = (i+1) + ". " + ch[i].name;
            document.getElementById('m-txt').innerText = isAnalog ? "MODE: ANALOG WAVE" : "MODE: DIGITAL DTV HD";
            document.getElementById('info').style.display = 'block';
            document.getElementById('alert-center').style.display = 'none';

            let strength = isAnalog ? 45 : 98;
            if(isLocked) strength = 0;
            document.getElementById('sig-val').innerText = strength;

            document.getElementById('bar').style.width = "0%";
            
            if (isLocked) {
                h.stopLoad(); v.pause();
                document.getElementById('alert-center').style.display = 'block';
            } else {
                h.loadSource(ch[i].url); h.attachMedia(v);
                document.getElementById('bar').style.width = "100%";
            }
            
            setTimeout(() => { document.getElementById('info').style.display = 'none'; }, 4000);
        }

        // 3. Sistem Notifikasi Sidebar Random
        const messages = [
            {t: "System Info", m: "Enkripsi Conecta link hd Aktif."},
            {t: "Signal Info", m: "Sinyal Satelit Palapa-D Terkunci."},
            {t: "Weather", m: "Peringatan: Cuaca buruk mungkin mengganggu sinyal."},
            {t: "Network", m: "Latensi Server 12ms [Optimal]."},
            {t: "Security", m: "Data transmisi dienkripsi AES-256."},
            {t: "System", m: "Auto-scan dijadwalkan pukul 00:00."},
            {t: "Broadcast", m: "Kualitas 1080p Super HD Aktif."}
        ];

        function showNotif(title, msg) {
            const side = document.getElementById('sidebar');
            const box = document.createElement('div');
            box.className = 'notif-box';
            box.innerHTML = `<div class="notif-title">${title}</div><div class="notif-msg">${msg}</div>`;
            side.appendChild(box);
            
            setTimeout(() => {
                box.style.animation = "fadeOut 0.5s forwards";
                setTimeout(() => box.remove(), 500);
            }, 5000);
        }

        function startNotifSystem() {
            setInterval(() => {
                const rand = messages[Math.floor(Math.random() * messages.length)];
                showNotif(rand.t, rand.m);
            }, 12000); // Muncul setiap 12 detik
        }

        function load() {
            fetch("https://iptv-org.github.io/iptv/languages/ind.m3u").then(r => r.text()).then(d => {
                ch = [];
                const lines = d.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) ch.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                }
                play(0);
                showNotif("System Ready", "Selamat Datang di CONECTA TV.");
            });
        }
    </script>
</body>
</html>
