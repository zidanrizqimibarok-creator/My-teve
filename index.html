    <script>
        const v = document.getElementById('v');
        const tv = document.getElementById('test-v');
        const h = new Hls(); const th = new Hls();
        const info = document.getElementById('info');
        const btxt = document.getElementById('btxt');
        const usbIn = document.getElementById('usb-input');
        const num = document.getElementById('num');
        const scBox = document.getElementById('shortcut');
        const alertBox = document.getElementById('alert-center');
        
        let ch = [], fullCh = [], cur = 0, scIdx = 0, b = "", mode = "AVS1", timerCD, count = 10, isSc = false;

        // INI BAGIAN NAVIGASI REMOT YANG TADI HILANG/BUG
        window.addEventListener('keydown', (e) => {
            const c = e.keyCode;

            // 1. NAVIGASI SAAT MENU SHORTCUT 7091 TERBUKA
            if (isSc) {
                if (c == 33 || c == 427 || e.key == "ArrowUp") { 
                    scIdx = (scIdx > 0) ? scIdx - 1 : ch.length - 1; 
                    openShortcut(); 
                }
                if (c == 34 || c == 428 || e.key == "ArrowDown") { 
                    scIdx = (scIdx < ch.length - 1) ? scIdx + 1 : 0; 
                    openShortcut(); 
                }
                if (e.key == "0") { play(scIdx); isSc = false; scBox.style.display = 'none'; }
                return; // Berhenti di sini kalau lagi buka menu
            }

            // 2. NAVIGASI PINDAH CHANNEL (PR+ / PR-)
            if (c == 33 || c == 427 || e.key == "ArrowUp") play(cur + 1);
            if (c == 34 || c == 428 || e.key == "ArrowDown") {
                // Logika Khusus: 82 + PR- untuk Restore
                if (b === "82") { 
                    localStorage.removeItem('aaa3_channels');
                    ch = [...fullCh]; 
                    play(0); 
                    b = ""; num.innerText = "";
                } else {
                    play(cur - 1);
                }
            }

            // 3. INPUT ANGKA (KODE SAKTI)
            if (/[0-9]/.test(e.key)) {
                b += e.key;
                num.innerText = b;
                clearTimeout(window.t);
                window.t = setTimeout(() => {
                    if (b === "7091") { scIdx = cur; isSc = true; openShortcut(); }
                    else if (b === "1062") deepScan();
                    else if (b === "2701") usbIn.click(); // USB Reader
                    else if (b === "0000") { mode = (mode === "AVS1" ? "AVS2" : "AVS1"); load(); }
                    else if (b !== "82") { // Kode 82 jangan dieksekusi sebelum PR-
                        let t = parseInt(b) - 1;
                        if (ch[t]) play(t);
                    }
                    
                    // Bersihkan angka di layar kecuali kode 82
                    if (b !== "82") { b = ""; num.innerText = ""; }
                }, 800);
            }
        });

        // FUNGSI PLAY & PERMANEN SCAN (LocalStorage)
        function play(i) {
            if (i < 0) i = ch.length - 1; if (i >= ch.length) i = 0;
            cur = i; alertBox.style.display = 'none';
            document.getElementById('n').innerText = "CH " + (i + 1) + " " + ch[i].name;
            info.style.display = 'block';
            
            clearInterval(timerCD);
            count = 10;
            btxt.innerText = "STATUS: LOADING " + count + "s";
            
            h.loadSource(ch[i].url); h.attachMedia(v);

            timerCD = setInterval(() => {
                count--;
                if(count >= 0) {
                    btxt.innerText = "STATUS: LOADING " + count + "s";
                } else {
                    clearInterval(timerCD);
                    if(v.readyState < 3) alertBox.style.display = 'block';
                    setTimeout(() => { info.style.display = 'none'; }, 2000);
                }
            }, 1000);
        }

        function openShortcut() {
            scBox.innerHTML = ""; scBox.style.display = 'grid';
            ch.forEach((item, i) => {
                let d = document.createElement('div');
                d.className = "sc-item" + (i === scIdx ? " focus" : "");
                d.innerHTML = `[${i+1}] ${item.name}`;
                scBox.appendChild(d);
            });
            scBox.children[scIdx].scrollIntoView({ block: "center" });
        }

        // USB FILE READER
        usbIn.onchange = (e) => {
            const file = e.target.files[0];
            const url = URL.createObjectURL(file);
            ch = [{name: "USB: " + file.name, url: url}];
            play(0);
        };

        function load() {
            // Cek Memori Permanen
            const saved = localStorage.getItem('aaa3_channels');
            let url = (mode === "AVS1") ? "https://iptv-org.github.io/iptv/languages/ind.m3u" : "https://iptv-org.github.io/iptv/categories/kids.m3u";
            
            fetch(url).then(r => r.text()).then(d => {
                const lines = d.split('\n'); let temp = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) temp.push({ name: lines[i].split(',')[1].trim(), url: lines[i+1].trim() });
                }
                fullCh = [...temp];
                ch = (saved && mode === "AVS1") ? JSON.parse(saved) : [...temp];
                play(0);
            });
        }
        load();
    </script>
