<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>ZEII TV V31 - ANTI BLACK SCREEN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        * { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        #video-container { width: 100vw; height: 100vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: fill; }
        
        /* Menu TV */
        #menu-tv {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 450px; height: 60vh; background: rgba(0, 5, 20, 0.98);
            border: 4px solid #00fbff; border-radius: 20px; z-index: 100;
            display: none; flex-direction: column; box-shadow: 0 0 100px #00fbff55;
        }
        .header { padding: 15px; background: #00fbff; color: #000; font-weight: 900; text-align: center; }
        .list { overflow-y: auto; flex: 1; padding: 10px; }
        .item { padding: 12px; border-bottom: 1px solid #111; cursor: pointer; display: flex; font-size: 1.1rem; }
        .item:hover { background: #00fbff; color: #000; }
        .num { width: 40px; color: #00fbff; font-weight: bold; }
        .item:hover .num { color: #000; }

        #num-pop { position: absolute; top: 10%; right: 10%; font-size: 8rem; color: #00fbff; font-weight: bold; z-index: 200; display: none; text-shadow: 0 0 20px #00fbff; }
        #osd { position: absolute; bottom: 5%; left: 5%; width: 90%; background: rgba(0,0,0,0.8); padding: 15px; border-left: 10px solid #00fbff; display: none; z-index: 50; }
    </style>
</head>
<body onload="initApp()">
    <div id="video-container">
        <video id="tv" autoplay playsinline></video>
    </div>

    <div id="num-pop"></div>

    <div id="menu-tv">
        <div class="header">DAFTAR SALURAN (Ketik: 1111)</div>
        <div class="list" id="ch-list"></div>
    </div>

    <div id="osd">
        <h2 id="ch-name">MENGHUBUNGKAN...</h2>
        <p style="color:#00fbff; font-size: 0.8rem;">ENGINE V31 - BYPASS ACTIVE</p>
    </div>

    <script>
        let channels = [];
        let player;
        let video;
        let inputStr = "";
        let inputTimer;
        let mode = "AVS1";

        async function initApp() {
            video = document.getElementById('tv');
            player = new shaka.Player(video);

            // Pengaturan agar TV tidak memblokir video
            player.configure({
                streaming: {
                    lowLatencyMode: true,
                    jumpLargeGaps: true
                }
            });

            // Error listener
            player.addEventListener('error', (e) => {
                console.error('Error Code:', e.detail.code);
                // Jika gagal, coba gunakan proxy
                if (e.detail.code === 1001 || e.detail.code === 3016) {
                    console.log("Retrying with Proxy Bypass...");
                }
            });

            fetchData();
        }

        function fetchData() {
            const url = (mode === "AVS2") ? "https://iptv-org.github.io/iptv/categories/kids.m3u" : "https://iptv-org.github.io/iptv/languages/ind.m3u";
            const listContainer = document.getElementById('ch-list');
            listContainer.innerHTML = "<div style='padding:20px;text-align:center;'>Mencari Sinyal...</div>";

            fetch(url).then(r => r.text()).then(data => {
                channels = [];
                listContainer.innerHTML = "";
                const lines = data.split('\n');
                let count = 0;

                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        let name = lines[i].split(',')[1].trim();
                        let link = lines[i+1].trim();
                        channels.push({ name, link });
                        
                        let div = document.createElement('div');
                        div.className = "item";
                        div.innerHTML = `<span class="num">${count + 1}</span> <span>${name}</span>`;
                        let currentIdx = count;
                        div.onclick = () => playCh(currentIdx);
                        listContainer.appendChild(div);
                        count++;
                    }
                }
            });
        }

        async function playCh(idx) {
            const ch = channels[idx];
            if (!ch) return;

            document.getElementById('menu-tv').style.display = 'none';
            document.getElementById('osd').style.display = 'block';
            document.getElementById('ch-name').innerText = ch.name;

            try {
                // Gunakan Proxy AllOrigins untuk membongkar blokir TV
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ch.link)}`;
                await player.load(proxyUrl);
                video.play();
            } catch (e) {
                // Jika proxy gagal, coba link original
                try { await player.load(ch.link); video.play(); } catch(err) { console.log("Total Dead Link"); }
            }

            setTimeout(() => { document.getElementById('osd').style.display = 'none'; }, 3000);
        }

        // Kontrol Remote Fisik TV / Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                inputStr += e.key;
                const pop = document.getElementById('num-pop');
                pop.innerText = inputStr;
                pop.style.display = 'block';

                clearTimeout(inputTimeout);
                inputTimeout = setTimeout(() => {
                    handleCode(inputStr);
                    inputStr = "";
                    pop.style.display = 'none';
                }, 2000);
            }
        });

        function handleCode(code) {
            if (code === "1111") {
                const m = document.getElementById('menu-tv');
                m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
            } else if (code === "0000") {
                mode = (mode === "AVS1") ? "AVS2" : "AVS1";
                fetchData();
            } else {
                let i = parseInt(code) - 1;
                if (channels[i]) playCh(i);
            }
        }
    </script>
</body>
</html>
